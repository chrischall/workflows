name: Claude Code

# Thin stub — the job lives in reusable-claude.yml, in this same repo.
#
# This repo hosts the fleet's shared workflows but was the one repo with no
# claude.yml of its own, so `@claude` on a PR here — the PRs that change the
# very workflows every other repo runs — did nothing.
#
# Pinned to @main like every consumer rather than the local `./` path: a PR
# editing reusable-claude.yml should be reviewed by the version that is live
# for the fleet, not by its own unreviewed edit.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: chrischall/workflows/.github/workflows/reusable-claude.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
