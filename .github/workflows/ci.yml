name: CI

# This repo's own check: lint every workflow + parse every action/template.
# Runs on every PR event (not deferred) so reusable-workflow changes are
# validated immediately — changes here affect 78 repos.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: validate composite actions and templates parse
        run: |
          ruby -ryaml -e 'Dir.glob(".github/actions/*/action.yml").each { |f| YAML.load_file(f) }; puts "actions OK"'
          ruby -ryaml -e 'Dir.glob("templates/*.yml").each { |f| YAML.load(File.read(f).gsub(/__[A-Z_]+__/, "x")) }; puts "templates OK"'
      - name: validate rendered output for every repo
        # The check above substitutes __X__ -> "x": synthetic, so it never sees
        # a real fleet.json value and cannot tell whether one landed in the
        # right place. This renders the actual cross product and asserts
        # structure — a skill-path pin outside `with:` parses perfectly and
        # still breaks the release.
        run: ruby scripts/validate-render.rb
      - name: arm-gate unit tests
        # The gate is the fleet's merge interlock, and it is bash inside YAML —
        # invisible to actionlint beyond syntax. These extract the shipped
        # `Arm gate` / `Report ci-gated status` scripts, stub `gh`, and assert
        # the whole run/post matrix, including the fork rows where a read-only
        # token means the status can never be posted.
        run: bash scripts/gate.test.sh

      - name: fleet drift sweep unit tests
        # The daily sweep is bash inside YAML, and every way it can be wrong is
        # quiet: it reports coverage in prose that nothing downstream reads.
        # These extract the shipped step, stub gh/rollout.sh, and pin the
        # exit-code matrix — including the #122 rows where a repo with no
        # usable credential must make the run red instead of warning into a
        # green log.
        run: bash scripts/fleet-drift.test.sh

      - name: follow-up lifecycle unit tests
        # Both halves of the auto-review follow-up issue's life are bash inside
        # YAML, and both fail QUIETLY: a regenerated checklist that un-ticks a
        # human's boxes reports finished work as outstanding, and a follow-up
        # whose PR closed unmerged reads like a live one forever (#139). These
        # extract the shipped steps, stub gh, and pin both matrices.
        run: bash scripts/followup.test.sh

      - name: verdict + arm-policy unit tests
        # This suite shipped without ever being wired in, so the no-verdict
        # diagnosis it guards was unguarded in CI. It also pins the arming
        # step's `if:` — an expression actionlint checks for syntax but not
        # for policy, and the only thing deciding whether a maintainer's
        # `/auto-review` starts a fork PR's CI.
        run: bash scripts/verdict.test.sh

      - name: rollout.sh unit tests
        # --check is what the daily drift sweep runs, and its failure mode is
        # silent under-reporting rather than a crash — nothing downstream would
        # notice. These stub `gh` and assert the whole report, not just the
        # first line.
        run: bash scripts/rollout.test.sh
