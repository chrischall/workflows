name: Reusable node CI

# Standard node CI for the fleet. Call from a stub on `pull_request`
# (types: [opened, synchronize, reopened, labeled]) and optionally
# `push: branches: [main]`.
#
# CI is DEFERRED until a PR is armed, but the un-armed state BLOCKS the merge.
# Two gate modes (input `gate-mode`):
#
#   fail (default, legacy): the `ci` job FAILS fast on an un-armed PR so the
#     required `ci / ci` check stays red until arming. Never skips — GitHub
#     treats a *skipped* required check as satisfied, so skipping `ci / ci`
#     here would leave the merge button live before CI ran.
#
#   status (target state): a `ci-gated` COMMIT STATUS blocks the merge, so the
#     `ci` job is free to reflect reality. Un-armed → the `gate` job posts
#     `ci-gated: pending` (yellow, blocks) and the `ci` job is SKIPPED — not a
#     misleading green "success" for a build that never ran. Armed → the `ci`
#     job runs and flips `ci-gated` to success/failure. A red `ci` run then
#     only ever means a real failure. Requires two things from the consumer,
#     flipped together:
#       1. the caller stub grants the token `statuses: write`
#          (`permissions: {contents: read, statuses: write}` — this workflow
#          must NOT request it itself: callers pass read-only by default and
#          a called workflow requesting elevation fails validation), and
#       2. the repo ruleset's required check is `ci-gated` (not `ci / ci`);
#          scripts/update-ruleset.sh flips it.
#
# Two jobs, not one: the `ci` job can only render as "skipped" via a job-level
# `if:` that never fires, but *something* still has to post the pending status
# in status mode. So the always-running `gate` job owns the arming decision and
# the pending post, and the `ci` job gates its real work on `gate`'s output.
#
# Real build/test runs only when:
#   - human PRs: `ready-to-merge` is present (added by auto-review on pass/warn);
#   - release-please PRs: `ready-to-merge` is present too — `release-ready` only
#     STARTS the release review; CI waits for that review to pass and arm the PR;
#   - bot PRs (dependabot): always (bots never get auto-review);
#   - push events: always.
#
# Fork PRs (status mode only): GitHub caps `GITHUB_TOKEN` to read-only for
# `pull_request` runs from a fork, whatever the stub's `permissions:` block
# asks for. So the `ci-gated` POST is impossible: it 403s, the gate job fails,
# `needs: gate` skips every build step, and the PR goes red without a single
# test having run — a fork PR could never go green or show a real result. The
# gate therefore arms CI for fork PRs and posts NOTHING from here: `ci / ci`
# carries the real pass/fail, and this job cannot report it.
#
# Since ci-fork-status.yml, the status IS posted — by a separate `workflow_run`
# workflow running in the BASE repo, where the token really has
# `statuses: write`. That changed the fail-safe deliberately: a fork PR used to
# be unmergeable until a maintainer hand-posted a status, and now it can go
# green. Two human gates remain and are what the change rests on: GitHub holds
# fork runs at `action_required` until a maintainer approves them (so CI never
# runs on unreviewed external code, and the reporter only ever mirrors an
# approved run), and a fork is armed only by a maintainer typing `/auto-review`
# — `pr-auto-review` never reviews a fork on its own, and it checks
# `author_association` before it runs. Auto-merge excludes forks regardless, so
# arming one buys it CI, never a merge. This job still posts nothing for forks —
# do not "fix" that by granting it permissions it cannot receive. Status mode
# only — in fail mode an un-armed PR is blocked by a RED `ci / ci`, so arming a
# fork there would flip that block green before review. (GitHub separately
# holds fork runs at `action_required` until a maintainer approves them, so
# this never executes unreviewed code.)
#
# Duplicate-run suppression (status mode only): a `labeled` event for a
# NON-arming label on an already-armed PR skips the build — the head SHA's
# `ci-gated` status is already set and is left untouched. This is only safe in
# status mode: in fail mode the skip would post a GREEN `ci / ci` run that
# overwrites a legitimately red one (failed tests) for the same SHA, re-opening
# the merge-button hole.
#
# No-clobber (status mode only): an un-armed gate never reverts a TERMINAL
# `ci-gated` (success/failure/error) on the same SHA back to `pending`. The
# status is mutable and keyed only by its context, so the last writer wins, and
# the arming decision reads labels from the EVENT PAYLOAD — a snapshot taken
# when GitHub queued the delivery. A late or duplicate delivery therefore
# carries a stale label set and re-decides an already-decided commit.
# honeybook-mcp#160 wedged exactly that way: armed CI passed and posted
# `ci-gated: success`, a duplicate `synchronize` for the SAME sha landed ten
# seconds later with labels from before `ready-to-merge`, and the un-armed path
# reverted the green to `pending` — leaving a PR armed for auto-merge, blocked
# on a required status, with no further event coming and no way out but a new
# commit. A terminal state means real CI ran for this exact commit; only a real
# run may change it.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "26"
      build-command:
        type: string
        required: false
        default: npm run build
      test-command:
        type: string
        required: false
        default: npm test
      gate-mode:
        description: >-
          fail (legacy: red `ci / ci` check blocks un-armed PRs) or status
          (a pending `ci-gated` commit status blocks instead and the `ci` job
          is skipped while un-armed — caller must grant `statuses: write` and
          the ruleset must require `ci-gated`).
        type: string
        required: false
        default: fail
      confirm-gate-lint:
        description: >-
          Run mcp-utils' confirm-gate lint against every MCP server this repo
          builds (the server bin of a package that depends on
          @modelcontextprotocol/server or /sdk: its only bin, or the bin named
          after the package) and fail on a tool that takes a boolean `confirm`
          input. On by default; a repo with no such package passes without
          linting anything. A server that needs config before it registers
          its tools reads placeholder KEY=value lines from
          .github/confirm-gate-lint.env.
        type: boolean
        required: false
        default: true
      fs-confinement-lint:
        description: >-
          Run mcp-utils' fs-confinement lint over this repo's source (in a
          repo that ships an MCP server bin, as for confirm-gate-lint) and
          fail on a call to fileBlob / readFileHead / resolveOutputDir,
          imported from @chrischall/mcp-utils, that passes no allowedRoots —
          a model-chosen path with no confinement. On by default.
        type: boolean
        required: false
        default: true
      strict-surface-lint:
        description: >-
          Run the confirm-gate lint's audit-annotations.mjs with --strict, so
          its surface warnings (annotations, manifest.json tool roster,
          env-var drift, plugin MCP config) fail CI instead of only being
          annotated. On by default; set false only as a per-repo emergency
          opt-out while the warnings are fixed (the warnings still show).
          Has no effect when confirm-gate-lint is false.
        type: boolean
        required: false
        default: true

jobs:
  # Always runs. Decides whether real CI should run, and in status mode posts
  # the pending `ci-gated` status that blocks an un-armed merge. No
  # `permissions:` key on purpose (same reason as the ci job below); the stub
  # owns the `statuses: write` grant status mode needs, fail-mode stubs need
  # nothing (this job makes no API call in fail mode).
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      msg: ${{ steps.gate.outputs.msg }}
    steps:
      # The decision itself lives ONLY in the arm-gate action (fleet-audit#1142):
      # this step used to carry an inline copy marked KEEP IN SYNC, so every
      # gate fix (#283) had to land twice. A remote ref, not `./`, because a
      # reusable workflow's `./` is the CALLER's checkout. `defer-failure`: in
      # fail mode this job must stay green and hand `msg` to the `ci` job,
      # which fails `ci / ci` — a red gate job would skip `ci` and leave the
      # required check unreported. scripts/gate.test.sh pins this wiring and
      # runs the action under both settings.
      - name: Arm gate
        id: gate
        uses: chrischall/workflows/.github/actions/arm-gate@main
        with:
          mode: ${{ inputs.gate-mode }}
          defer-failure: true

  ci:
    needs: gate
    runs-on: ubuntu-latest
    # fail mode: always run so an un-armed PR FAILS the required `ci / ci`
    # check (a skipped required check counts as satisfied). status mode: run
    # when the gate armed CI — un-armed leaves this SKIPPED, with the pending
    # `ci-gated` status doing the blocking — OR when the gate job itself FAILED,
    # in which case every build step below stays skipped (`run` is empty) and
    # this job exists only to run the reporter. Without that last clause a gate
    # that errors leaves `ci-gated` on whatever it was, forever: the required
    # status never resolves and only a new push can clear it.
    if: >-
      always() &&
      ( inputs.gate-mode == 'fail' ||
        (needs.gate.result == 'success' && needs.gate.outputs.run == 'true') ||
        (inputs.gate-mode == 'status' && needs.gate.result == 'failure') )
    # No `permissions:` key on purpose: it would either drop the caller's
    # `statuses: write` grant (if we pinned contents: read) or fail validation
    # on legacy read-only callers (if we requested statuses: write). The stub
    # owns the grant; fail-mode stubs need nothing.
    steps:
      # fail mode only (in status mode this job is skipped while un-armed): make
      # the required `ci / ci` check red until the PR is armed.
      - name: Un-armed → fail the required check
        # Mode-guarded: in status mode `run != 'true'` is now also reachable via
        # the gate-failure reporter path, where this message would be a lie.
        if: inputs.gate-mode == 'fail' && needs.gate.outputs.run != 'true'
        env:
          MSG: ${{ needs.gate.outputs.msg }}
        run: |
          echo "::error::$MSG This failing check is expected and clears once the PR is armed."
          exit 1

      - uses: actions/checkout@v7.0.1
        if: needs.gate.outputs.run == 'true'

      - uses: actions/setup-node@v7.0.0
        if: needs.gate.outputs.run == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - if: needs.gate.outputs.run == 'true'
        run: npm ci

      - if: needs.gate.outputs.run == 'true'
        run: ${{ inputs.build-command }}

      - if: needs.gate.outputs.run == 'true'
        run: ${{ inputs.test-command }}

      # Confirm-gate lint (fleet-audit#945). A hand-rolled `confirm:
      # z.boolean()` is the deprecated gate a model can satisfy on its first
      # call, and the fleet's confirmToken migration missed three repos that
      # declared one without importing schemaConfirm — the grep that drove it
      # never saw them. So this reads what the BUILT server publishes over
      # stdio (tools/list inputSchema), where no spelling can hide it, using
      # the rule in mcp-utils' scripts/lib/confirm-gates.mjs. A boolean
      # `confirm` input fails the job; a write without confirmToken is only
      # listed (many additive writes are ungated on purpose).
      #
      # WHICH bin is the server: a package may ship helper CLIs beside it
      # (canvas-parent-mcp's `canvas-parent-mcp-qr-login` is an interactive
      # login, not an MCP server — started as one it just hangs). So a package
      # with one bin file lints that file, and a package with several lints
      # only the bin named after the package; several with none of them named
      # after it is an error, never a guess.
      #
      # Discovery runs FIRST: a repo with nothing to lint (a library, the
      # host, a non-MCP CLI) passes without touching the network.
      #
      # The scripts are not in the npm package (`files: ["dist"]`), so they
      # are cloned from mcp-utils at the release TAG below — never a branch or
      # a SHA. The rule decides whether every fleet PR can merge, so it moves
      # only when this line does: bump it after an mcp-utils release that
      # changes the audit scripts. The MCP client the script imports is
      # installed at the exact version that tag's lockfile pins, in a
      # throwaway directory, so it depends on nothing the calling repo does or
      # does not install (the client is an OPTIONAL peer of mcp-utils).
      #
      # Each server starts with PATH and HOME only, so nothing from the runner
      # leaks into it. A server that registers its tools only once configured
      # would then serve just its healthcheck and hide every tool from the
      # lint — so a server that serves nothing BUT a healthcheck fails, and
      # the repo gives it PLACEHOLDER config (never a real secret) in
      # `.github/confirm-gate-lint.env`, one KEY=value per line.
      #
      # FS confinement (the same issue's other half) is a SOURCE check, since
      # a served inputSchema says `path: string` whether or not the tool
      # confines it: mcp-utils' scripts/audit-fs-confinement.mjs fails a call
      # to fileBlob / readFileHead / resolveOutputDir, imported from
      # @chrischall/mcp-utils, that passes no `allowedRoots`. It runs from the
      # same tagged clone, before any server starts, and a failure there
      # still lets the served lint run so one push shows every problem.
      # Each half has its own input so a repo can opt out of one.
      #
      # Surface checks: since mcp-utils 3.0.0 audit-annotations.mjs also
      # prints `::warning` lines for missing annotation hints, a manifest.json
      # tools[] roster that differs from the served tools, env vars read but
      # undeclared (or declared but dead), and plugin MCP config mistakes.
      # They fail CI because this step passes --strict (all fleet repos were
      # clean under 3.0.2 when it was turned on); strict-surface-lint: false
      # is the per-repo emergency opt-out that makes them advisory again.
      # scripts/confirm-gate-lint.test.sh runs this exact script.
      - name: MCP lints (confirm gates, fs confinement)
        if: needs.gate.outputs.run == 'true' && (inputs.confirm-gate-lint || inputs.fs-confinement-lint)
        env:
          MCP_UTILS_LINT_TAG: v3.0.2
          CONFIRM_GATE_LINT: ${{ inputs.confirm-gate-lint }}
          FS_CONFINEMENT_LINT: ${{ inputs.fs-confinement-lint }}
          STRICT_SURFACE_LINT: ${{ inputs.strict-surface-lint }}
        run: |
          set -euo pipefail
          LINT="$RUNNER_TEMP/confirm-gate-lint"
          rm -rf "$LINT"; mkdir -p "$LINT/run"

          # The server bin of every package (root, then npm workspaces) that
          # depends on the MCP server SDK. A library, a host
          # (mcp-host) or a CLI that is not an MCP server (fetchproxy's fpx)
          # lists nothing and is skipped.
          cat > "$LINT/servers.cjs" <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const read = (dir) => JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'));
          const root = read('.');
          const patterns = Array.isArray(root.workspaces) ? root.workspaces : (root.workspaces?.packages ?? []);
          const dirs = ['.'];
          for (const pat of patterns) {
            if (pat.endsWith('/*') && !pat.slice(0, -2).includes('*')) {
              const base = pat.slice(0, -2);
              if (!fs.existsSync(base)) continue;
              for (const d of fs.readdirSync(base, { withFileTypes: true }).sort((a, b) => a.name.localeCompare(b.name))) {
                if (d.isDirectory()) dirs.push(path.join(base, d.name));
              }
            } else if (!pat.includes('*')) {
              dirs.push(pat);
            } else {
              console.error(`::error::unsupported workspaces pattern "${pat}" (only "dir" and "dir/*")`);
              process.exit(2);
            }
          }
          const MCP_SERVER = /^@modelcontextprotocol\/(server|sdk)$/;
          const seen = new Set();
          for (const dir of dirs) {
            if (!fs.existsSync(path.join(dir, 'package.json'))) continue;
            const pkg = read(dir);
            const deps = Object.keys({ ...pkg.dependencies, ...pkg.devDependencies });
            if (!deps.some((d) => MCP_SERVER.test(d))) continue;
            const short = String(pkg.name ?? '').replace(/^@[^/]+\//, '');
            const bins = typeof pkg.bin === 'string' ? { [short]: pkg.bin } : (pkg.bin ?? {});
            const files = [...new Set(Object.values(bins).map((b) => path.normalize(path.join(dir, b))))];
            let entry;
            if (files.length === 1) entry = files[0];
            else if (files.length > 1) {
              if (!(short in bins)) {
                console.error(`::error::${path.join(dir, 'package.json')} ships several bins (${Object.keys(bins).join(', ')}) and none is named after the package ("${short}"), so the confirm-gate lint cannot tell which one is the MCP server. Name the server bin "${short}", or set confirm-gate-lint: false.`);
                process.exit(2);
              }
              entry = path.normalize(path.join(dir, bins[short]));
            }
            if (entry && !seen.has(entry)) { seen.add(entry); console.log(entry); }
          }
          JS
          SERVERS="$(node "$LINT/servers.cjs")"
          if [ -z "$SERVERS" ]; then
            echo "No package here ships an MCP server bin — nothing to lint."
            exit 0
          fi

          # Placeholder config for servers that register tools only when
          # configured. Literal KEY=value lines; blank lines and #comments
          # are skipped; PATH and HOME cannot be overridden.
          SERVER_ENV=()
          ENV_FILE=.github/confirm-gate-lint.env
          if [ "$CONFIRM_GATE_LINT" = true ] && [ -f "$ENV_FILE" ]; then
            n=0
            while IFS= read -r line || [ -n "$line" ]; do
              n=$((n+1))
              case "$line" in ''|'#'*) continue ;; esac
              key="${line%%=*}"
              if [ "$key" = "$line" ] || ! printf '%s\n' "$key" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$' || [ "$key" = PATH ] || [ "$key" = HOME ]; then
                echo "::error file=$ENV_FILE,line=$n::expected KEY=value (KEY a shell name, not PATH or HOME)"
                exit 1
              fi
              SERVER_ENV+=("$line")
            done < "$ENV_FILE"
            echo "Starting servers with ${#SERVER_ENV[@]} placeholder variable(s) from $ENV_FILE."
          fi

          MCP_UTILS_REPO=https://github.com/chrischall/mcp-utils.git
          if ! printf '%s\n' "$MCP_UTILS_LINT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::MCP_UTILS_LINT_TAG '$MCP_UTILS_LINT_TAG' is not a release tag (vX.Y.Z). The lint is read from a tag, never a branch or a SHA."
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "$MCP_UTILS_REPO" "refs/tags/$MCP_UTILS_LINT_TAG" >/dev/null; then
            echo "::error::mcp-utils has no tag $MCP_UTILS_LINT_TAG."
            exit 1
          fi
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$MCP_UTILS_LINT_TAG" "$MCP_UTILS_REPO" "$LINT/mcp-utils"
          cp -R "$LINT/mcp-utils/scripts" "$LINT/run/scripts"

          rc=0
          if [ "$FS_CONFINEMENT_LINT" = true ]; then
            if [ ! -f "$LINT/run/scripts/audit-fs-confinement.mjs" ]; then
              echo "::error::mcp-utils $MCP_UTILS_LINT_TAG has no scripts/audit-fs-confinement.mjs, so the fs-confinement lint cannot run. Pin a release that ships it."
              exit 1
            fi
            echo "::group::fs-confinement lint (source)"
            status=0
            node "$LINT/run/scripts/audit-fs-confinement.mjs" . --github </dev/null || status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::the fs-confinement lint failed: a call to mcp-utils' fileBlob / readFileHead / resolveOutputDir passes no allowedRoots, so a model-chosen path is unconfined (annotated above). Pass allowedRoots — the directories the tool may read or write, e.g. from a <SVC>_UPLOAD_DIR / <SVC>_OUTPUT_DIR setting — or set fs-confinement-lint: false."
              rc=1
            fi
          fi
          if [ "$CONFIRM_GATE_LINT" != true ]; then exit "$rc"; fi

          CLIENT_VERSION="$(node -p 'require(process.argv[1]).packages["node_modules/@modelcontextprotocol/client"].version' "$LINT/mcp-utils/package-lock.json")"
          printf '{"private":true}\n' > "$LINT/run/package.json"
          npm install --prefix "$LINT/run" --ignore-scripts --no-audit --no-fund --no-package-lock \
            "@modelcontextprotocol/client@$CLIENT_VERSION" >/dev/null

          AUDIT_ARGS=()
          if [ "$STRICT_SURFACE_LINT" = true ]; then AUDIT_ARGS+=(--strict); fi

          while IFS= read -r entry; do
            if [ ! -f "$entry" ]; then
              echo "::error::$entry is an MCP server bin in package.json but the build did not produce it, so its tools cannot be linted."
              rc=1; continue
            fi
            echo "::group::confirm-gate lint: $entry"
            status=0
            env -i PATH="$PATH" HOME="$HOME" ${SERVER_ENV[@]+"${SERVER_ENV[@]}"} timeout 120 \
              node "$LINT/run/scripts/audit-annotations.mjs" "$entry" ${AUDIT_ARGS[@]+"${AUDIT_ARGS[@]}"} </dev/null >"$LINT/out.txt" 2>&1 || status=$?
            cat "$LINT/out.txt"
            echo "::endgroup::"
            # Per-tool lines of audit-annotations.mjs: "  <class> <name>...".
            # Since 3.0.0 it also prints surface-check `::warning` lines after
            # its summary. They never match this sed. Under --strict they exit
            # 1 — only once the confirm-boolean check has passed — after a
            # "--strict: N surface warning(s) above." line, which is how a
            # surface failure is told apart from a confirm boolean or a crash.
            tools="$(sed -nE 's/^  (read|additive|DESTRUCTIVE) +([^ ]+).*/\2/p' "$LINT/out.txt")"
            real="$(printf '%s\n' "$tools" | grep -Ev '(^|_)healthcheck$' | grep -c . || true)"
            surface="$(sed -nE 's/^--strict: ([0-9]+) surface warning.*/\1/p' "$LINT/out.txt" | head -n 1)"
            if [ "$status" -eq 124 ]; then
              echo "::error::$entry did not answer tools/list over stdio within 120s."
              rc=1
            elif [ "$status" -ne 0 ] && [ -n "$surface" ]; then
              counts="$(grep -m 1 '^surface checks' "$LINT/out.txt" | sed -E 's/^surface checks +//; s/ +/ /g' || true)"
              echo "::error::$entry failed the strict surface lint: $surface surface warning(s) (${counts:-see above}), annotated above. Fix each one: give the tool an explicit destructiveHint / openWorldHint, make manifest.json tools[] match the served tools, declare every env var the server reads (and drop dead ones) in manifest.json / server.json / .mcp.json, and fix the plugin MCP config. If the fleet cannot wait, set strict-surface-lint: false in this repo's CI stub as an emergency opt-out (the warnings stay visible)."
              rc=1
            elif [ "$status" -ne 0 ]; then
              echo "::error::$entry failed the confirm-gate lint: a tool takes a boolean \`confirm\` input (gate it with confirmToken + requireConfirmationWithFallback, or drop the gate), or the server did not start. The group above says which."
              rc=1
            elif [ "$real" -eq 0 ]; then
              echo "::error::$entry served no tool beyond a healthcheck ($(printf '%s' "$tools" | tr '\n' ' ')) with an empty environment, so the lint saw none of its real tools. If it registers them only once configured, give it placeholder config (never a real secret) in $ENV_FILE, one KEY=value per line."
              rc=1
            fi
          done <<< "$SERVERS"
          exit "$rc"

      # Status mode: flip ci-gated to the real outcome. `always()` so a failed
      # build/test posts `failure` (merge stays blocked, and the checks UI
      # explains why) instead of leaving a stale `pending`.
      - name: Report ci-gated status
        if: >-
          always() && inputs.gate-mode == 'status' && github.event_name == 'pull_request' &&
          (needs.gate.outputs.run == 'true' || needs.gate.result == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          GATE_RESULT: ${{ needs.gate.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # Fork PR: read-only token, so this POST would 403 and turn a
          # legitimately green run red. The gate deliberately posted nothing
          # either, so ci-gated stays unreported and the merge stays blocked.
          if [ -n "$PR_HEAD_REPO" ] && [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "fork PR ($PR_HEAD_REPO) → not posting ci-gated (read-only token). The 'ci / ci' result above is the real one; the required ci-gated context stays unreported, so the merge stays blocked."
            echo "To merge once you have reviewed this run, post the status yourself — that IS the maintainer decision this gate defers to:"
            echo "  gh api repos/$REPO/statuses/$HEAD_SHA -f state=success -f context=ci-gated -f description='fork PR - CI verified by maintainer'"
            echo "Then: gh pr merge <n> --squash. Note --admin does NOT bypass a repository RULESET, only its bypass_actors list does."
            exit 0
          fi
          # GATE_RESULT first: when the gate job failed, every build step here
          # was skipped, so this job's own status is `success` and would
          # otherwise report a CI pass that never ran.
          if [ "$GATE_RESULT" = "failure" ]; then STATE=failure; DESC="arm gate failed — see the gate job log";
          elif [ "$JOB_STATUS" = "success" ]; then STATE=success; DESC="CI passed"; else STATE=failure; DESC="CI failed — see the ci / ci job log"; fi
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context=ci-gated -f description="$DESC" >/dev/null
          echo "ci-gated → $STATE"
