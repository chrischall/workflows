name: Reusable PR auto-review

# Fleet-canonical PR review. Call from a stub on `pull_request`
# (types: [opened, reopened, ready_for_review, synchronize, labeled]).
# The stub owns workflow-level concurrency (a called workflow cannot).
#
# Contract:
#  1. Applies the `auto-review` label; requests Copilot (best-effort).
#  2. Runs claude-code-action with a JSON-schema-bound verdict
#     pass | warn | fail, plus important_findings and nits lists.
#  3. ALWAYS surfaces the verdict as a marker-tagged PR comment and a step
#     output; FAILS the job if no verdict can be determined.
#  4. Whenever the review surfaced findings — `warn`/`fail` verdicts, or a
#     `pass` whose structured output still lists nits — opens or updates ONE
#     `auto-review-followup` issue per PR (idempotent via a hidden marker)
#     holding every finding as a checklist, and links it from the verdict
#     comment so it is not forgotten. Re-reviews regenerate that checklist but
#     preserve ticks a human made (exact-text match) and stamp the reviewed
#     commit. A follow-up whose PR closes UNMERGED is retired by
#     `followup-orphan-sweep.yml` in chrischall/workflows, not here.
#  5. On `pass` OR `warn`, adds `ready-to-merge` via the caller's PAT
#     (GITHUB_TOKEN would not fire the auto-merge workflow): nits never block —
#     they ride along on the tracking issue. `fail` blocks (never auto-arms).
#
# Why `pull_request` (not `pull_request_target`): Anthropic's OIDC backend
# rejects `pull_request_target` (anthropics/claude-code-action#713), and a
# `pull_request` run from a fork gets NO secrets — so a fork cannot be reviewed
# on that trigger at all.
#
# Forks are reviewed through `issue_comment` instead, which fires in the BASE
# repo with secrets intact (the same mechanism claude.yml uses). A maintainer
# comments `/auto-review`; the `context` job checks `author_association` before
# anything runs. That command IS the human gate — a fork review never starts on
# its own, and unlike the same-repo path there is no event that triggers it
# automatically.
#
# A fork verdict is INFORMATION ONLY: the arming step never labels a fork, so
# `ready-to-merge` stays a human action. Combined with the arm-gate deferring
# un-armed fork CI, that means reviewing a fork neither merges it nor starts its
# build — both remain deliberate acts.
#
# Bot PRs (dependabot etc.) skip review entirely (user.type filter) and go
# straight to CI + auto-merge. PRs already labeled `ready-to-merge` skip
# re-review. That is a trap when the PR is then force-pushed: the standing
# verdict describes code no longer in the PR, and auto-merge ships the new diff
# on the old approval. Set `rereview_on_push: true` to close it — such a run
# de-arms the PR first and re-reviews, so the arming label always corresponds to
# the diff that was actually reviewed. Release-please PRs review only once `release-ready` is added — and
# their CI stays deferred until that review passes and arms `ready-to-merge`,
# exactly like a human PR (`release-ready` triggers the review, it does not arm
# CI on its own).

on:
  workflow_call:
    inputs:
      conventions_hint:
        description: >-
          Repo-specific conventions appended to the review prompt
          (e.g. "TDD project; Envers auditing rules apply").
        type: string
        required: false
        default: ""
      rereview_on_push:
        description: >-
          Re-review a PR that already carries `ready-to-merge` when new commits
          are pushed to it, de-arming it until the new verdict lands. Off by
          default: it only ADDS review runs, but it also delays merges (an armed
          PR stops being armed until re-reviewed), and release-please PRs are
          force-pushed whenever main moves. Opt in per repo, confirm, then
          consider flipping the default.
        type: boolean
        required: false
        default: false
    secrets:
      claude_code_oauth_token:
        description: OAuth token from `claude setup-token` (Max plan quota)
        required: true
      release_pat:
        description: PAT used to add ready-to-merge so auto-merge fires
        required: true

jobs:
  # Normalises the PR context so the review job can be reached from two very
  # different payloads.
  #
  # `pull_request` carries the PR inline but withholds secrets on a fork run —
  # so a fork can never be reviewed there. `issue_comment` fires in the BASE
  # repo WITH secrets (the mechanism claude.yml already uses to reach forks) but
  # carries no `pull_request` object at all: every one of the ~23
  # `github.event.pull_request.*` reads below would be null. Hence this job:
  # one place that produces the same fields whichever event arrived.
  context:
    # Gated on PAYLOAD-ONLY conditions so an event that can never be reviewed
    # starts no runner at all.
    #
    # A job cannot read its own outputs from its `if:`, so normalising the two
    # payloads into one job meant a runner started for EVERY delivered event —
    # including the ones that immediately skip. `issue_comment` fires on every
    # comment on every PR, so that is the common case, not the rare one.
    #
    # Everything below is readable straight from the webhook payload, which is
    # why it can live here. The fields that are NOT (draft/labels/head_ref on an
    # issue_comment) stay in the review job's `if:`, evaluated from this job's
    # outputs.
    #
    # This guard MUST stay a SUBSET of the review job's condition: it may only
    # reject what that job would also reject. Anything stricter silently drops
    # a review that should have happened, with no run to point at.
    if: |
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.event.pull_request.user.type == 'User'
        && (!contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
            || (inputs.rereview_on_push && github.event.action == 'synchronize'))
        && (github.event.action != 'labeled'
            || github.event.label.name == 'review-with-opus'
            || github.event.label.name == 'release-ready'
            || contains(fromJSON('["enhancement","bug","dependencies","documentation","ci","test","security","ignore-for-release"]'), github.event.label.name))
        && (!startsWith(github.event.pull_request.head.ref, 'release-please--')
            || contains(github.event.pull_request.labels.*.name, 'release-ready'))
        && (!contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
            || contains(github.event.pull_request.labels.*.name, 'release-ready')))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '/auto-review')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      title: ${{ steps.pr.outputs.title }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      is_fork: ${{ steps.pr.outputs.is_fork }}
      draft: ${{ steps.pr.outputs.draft }}
      user_type: ${{ steps.pr.outputs.user_type }}
      labels: ${{ steps.pr.outputs.labels }}
      eligible: ${{ steps.pr.outputs.eligible }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # On issue_comment the PR number lives on `issue`; on pull_request it
          # is on `pull_request`. Exactly one is set.
          # The RAW payload, deliberately — this job BOOTSTRAPS the context that
          # everything downstream reads, so it cannot read `needs.context`
          # (itself). A blanket rewrite of `github.event.pull_request.*` to the
          # context outputs caught this line too; actionlint flagged it as
          # `property "context" is not defined`.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOC: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail

          # A comment on a plain ISSUE is not a PR review request. Bail before
          # spending an API call.
          if [ "$EVENT" = "issue_comment" ] && [ "$IS_PR_COMMENT" != "true" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"; echo "not a PR comment"; exit 0
          fi

          # The fork path is HUMAN-GATED and that gate is here: a maintainer has
          # to type the command, and `author_association` has to be one the repo
          # trusts. A fork review never starts on its own.
          if [ "$EVENT" = "issue_comment" ]; then
            case "$COMMENT_BODY" in *"/auto-review"*) ;; *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"; echo "no /auto-review command"; exit 0 ;;
            esac
            case "$COMMENT_ASSOC" in OWNER|MEMBER|COLLABORATOR) ;; *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "::notice::/auto-review ignored — comment author_association is '$COMMENT_ASSOC', not a maintainer of this repo."
              exit 0 ;;
            esac
          fi

          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq \
            '{number, title, draft, head_sha: .head.sha, base_sha: .base.sha, head_ref: .head.ref, head_repo: .head.repo.full_name, user_type: .user.type, labels: [.labels[].name]}')

          {
            echo "number=$(printf '%s' "$pr" | jq -r .number)"
            echo "head_sha=$(printf '%s' "$pr" | jq -r .head_sha)"
            echo "base_sha=$(printf '%s' "$pr" | jq -r .base_sha)"
            echo "head_ref=$(printf '%s' "$pr" | jq -r .head_ref)"
            echo "head_repo=$(printf '%s' "$pr" | jq -r .head_repo)"
            echo "draft=$(printf '%s' "$pr" | jq -r .draft)"
            echo "user_type=$(printf '%s' "$pr" | jq -r .user_type)"
            echo "labels=$(printf '%s' "$pr" | jq -c .labels)"
            echo "eligible=true"
          } >> "$GITHUB_OUTPUT"

          # Multi-line safe: a PR title can contain anything.
          {
            echo "title<<__EOT__"
            printf '%s\n' "$pr" | jq -r .title
            echo "__EOT__"
          } >> "$GITHUB_OUTPUT"

          head_repo=$(printf '%s' "$pr" | jq -r .head_repo)
          if [ "$head_repo" = "$REPO" ]; then
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write       # Claude App OIDC token exchange
    needs: context
    # Same rules as before, now read from `context` so they hold for BOTH
    # payloads. The one addition is the fork arm: a fork reaches this job ONLY
    # via a maintainer's `/auto-review` comment, which `context` has already
    # verified — it can never start on its own.
    #
    # A RELEASE-NOTES label re-triggers the review, because adding one is the
    # documented fix for a finding this reviewer itself issues: several repos
    # require exactly one per PR and `fail` a PR without it. Before that, the
    # remedy did not re-run the thing that demanded it — the `fail` stood, and
    # the merge stayed blocked by a finding already fixed.
    #
    # Worse than merely stuck: applying the label fires a `labeled` event this
    # condition (correctly) skips, so a SKIPPED run then sits at the top of the
    # run list looking like the latest review. Anyone reaching for "re-run the
    # review" grabs that one, it skips again, and nothing changes
    # (flightaware-mcp#63).
    if: |
      needs.context.outputs.eligible == 'true' &&
      needs.context.outputs.draft == 'false' &&
      needs.context.outputs.user_type == 'User' &&
      (needs.context.outputs.is_fork == 'false' || github.event_name == 'issue_comment') &&
      (!startsWith(needs.context.outputs.head_ref, 'release-please--') || contains(needs.context.outputs.labels, '"release-ready"')) &&
      (!contains(needs.context.outputs.labels, '"autorelease: pending"') || contains(needs.context.outputs.labels, '"release-ready"')) &&
      (!contains(needs.context.outputs.labels, '"ready-to-merge"') || (inputs.rereview_on_push && github.event.action == 'synchronize') || github.event_name == 'issue_comment') &&
      (github.event.action != 'labeled'
        || github.event.label.name == 'review-with-opus'
        || github.event.label.name == 'release-ready'
        || contains(fromJSON('["enhancement","bug","dependencies","documentation","ci","test","security","ignore-for-release"]'), github.event.label.name))
    steps:
      # A push to an ALREADY-ARMED PR must not keep the old verdict: the arming
      # label was granted for a diff that no longer exists, and auto-merge will
      # happily ship the new one. De-arm first; the verdict step re-adds the
      # label if this diff also passes.
      - name: De-arm on new commits
        if: ${{ inputs.rereview_on_push && github.event.action == 'synchronize' && contains(needs.context.outputs.labels, '"ready-to-merge"') }}
        env:
          GH_TOKEN: ${{ secrets.release_pat || secrets.GITHUB_TOKEN }}
          PR: ${{ needs.context.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --remove-label ready-to-merge
          echo "New commits pushed to an armed PR — removed ready-to-merge pending re-review."

      - name: Apply auto-review label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.context.outputs.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR" --repo "$REPO" --add-label auto-review

      - name: Request Copilot reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.context.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          # 422 if Copilot review isn't enabled for the repo — swallow it.
          if gh api --method POST \
              "/repos/${REPO}/pulls/${PR}/requested_reviewers" \
              -f 'reviewers[]=Copilot' 2>/tmp/copilot.err; then
            echo "Requested Copilot as reviewer."
          else
            echo "Could not request Copilot reviewer (likely not enabled):"
            cat /tmp/copilot.err
          fi

      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          # EXPLICIT ref, because this workflow now has two triggers. On
          # `pull_request` the default checkout is already the PR merge ref, but
          # on `issue_comment` the default is the BASE branch — so a fork review
          # would have reviewed main and reported confidently on code that is
          # not in the PR. `refs/pull/N/head` is the PR's head on both triggers,
          # and it is the same form claude.yml uses to reach fork PRs.
          ref: refs/pull/${{ needs.context.outputs.number }}/head
          # Full history so the reviewer can resolve commit reachability
          # (e.g. CHANGELOG links "reachable from origin/main"). A shallow
          # depth-1 clone has no main history, producing false "broken link"
          # fails on release PRs whose CHANGELOG references older commits.
          fetch-depth: 0

      # Reviewer models issued three false `fail` verdicts in one day claiming
      # a CHANGELOG-referenced commit was "not an ancestor of the release"
      # (mcp-host#127, mcp-host#134, untappd-mcp#110) — escalating from
      # asserting without checking, to fabricating a command transcript after
      # the prompt required quoted evidence, to contradicting a correct
      # ground-truth table injected into the prompt. Instructions cannot make
      # a model's evidence authentic, so the pipeline owns this claim family
      # outright: this step computes the facts with real git, a genuine
      # violation fails the review deterministically (the model never runs),
      # and on a clean table the verdict step discards any contradicting
      # finding the model emits anyway.
      - name: Precompute changelog commit ancestry (ground truth)
        id: ancestry
        env:
          EVENT_BASE_SHA: ${{ needs.context.outputs.base_sha }}
        run: |
          # Diff base comes from the API, via the `context` job — NOT from
          # HEAD^1/HEAD^2.
          #
          # That heuristic read the first parent of `refs/pull/N/merge`, which
          # only holds while the checkout IS the merge ref. This workflow now
          # pins `refs/pull/N/head` (so a fork review sees the PR rather than
          # the base branch), and a head commit can itself be a merge — after
          # GitHub's "Update branch", for instance — in which case `HEAD^2`
          # exists and `HEAD^1` is the PREVIOUS head, not the base. The
          # deterministic CHANGELOG-ancestry check would then run against a
          # wrong base and could fail a clean PR.
          #
          # The heuristic existed only to beat a stale payload `base.sha` on
          # label-triggered re-reviews. `context` resolves the PR through the
          # API at run time, so its base_sha is already current and there is
          # nothing left to beat.
          BASE_SHA="$EVENT_BASE_SHA"

          # `fetch-depth: 0` normally brings the base commit with it, but a
          # force-push or a very fresh base can leave it absent. Fetch it
          # rather than letting the diff below fail open on a bad range.
          if ! git rev-parse -q --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
            git fetch -q --no-tags origin "$BASE_SHA" 2>/dev/null || true
          fi

          # {40,} then length==40: a 40-char slice of a longer hex string
          # (e.g. a sha256 in the text) must not masquerade as a commit.
          # Every segment is failure-guarded: this step must never be the
          # reason a fleet repo's review job dies (pipefail is on).
          SHAS=$({ git diff "$BASE_SHA"..HEAD -- CHANGELOG.md 2>/dev/null || true; } \
            | { grep -E '^\+' || true; } | { grep -oE '[0-9a-f]{40,}' || true; } \
            | awk 'length($0) == 40' | sort -u)

          VIOLATIONS=""; MISSING=""
          {
            echo "report<<ANCESTRY_EOF"
            if [ -z "$SHAS" ]; then
              echo "This PR adds no commit SHAs to CHANGELOG.md — no ancestry facts to assert."
            else
              for sha in $SHAS; do
                if ! git cat-file -e "$sha" 2>/dev/null; then
                  # Not provably wrong (a hand-edited entry may cite another
                  # repo's commit), so surfaced but not a violation.
                  echo "- ${sha:0:7}: NOT PRESENT in this repository's object store"
                  MISSING="${MISSING:+$MISSING, }${sha:0:7}"
                elif git merge-base --is-ancestor "$sha" HEAD; then
                  echo "- ${sha:0:7} ($(git log -1 --format=%s "$sha")): IS an ancestor of this PR's HEAD — included in the change"
                else
                  echo "- ${sha:0:7} ($(git log -1 --format=%s "$sha")): NOT an ancestor of this PR's HEAD"
                  VIOLATIONS="${VIOLATIONS:+$VIOLATIONS, }${sha:0:7}"
                fi
              done
            fi
            echo "ANCESTRY_EOF"
            echo "violations=$VIOLATIONS"
          } >> "$GITHUB_OUTPUT"
          [ -n "$MISSING" ] && echo "::warning::CHANGELOG references commit(s) not in this repository: $MISSING"
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::CHANGELOG documents commits not included in this PR: $VIOLATIONS"
          fi

      - name: Pick model by PR size (or label override)
        id: model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.context.outputs.number }}
          REPO: ${{ github.repository }}
          HAS_OPUS_LABEL: ${{ contains(needs.context.outputs.labels, '"review-with-opus"') }}
          HEAD_REF: ${{ needs.context.outputs.head_ref }}
        run: |
          # Four-tier ladder by additions+deletions; `review-with-opus`
          # label forces Opus. Never the [1m] context variant.
          # Fleet-wide single source of truth for review models — every repo
          # consumes this workflow via @main, so model bumps land here only.
          CHANGED=$(gh api "/repos/${REPO}/pulls/${PR}" --jq '.additions + .deletions')
          if [ "$HAS_OPUS_LABEL" = "true" ]; then
            MODEL="claude-opus-5"
            REASON="\`review-with-opus\` label (forced)"
          elif [ "$CHANGED" -le 50 ]; then
            MODEL="claude-haiku-4-5"
            REASON="${CHANGED} lines (≤50, trivial)"
          elif [ "$CHANGED" -le 500 ]; then
            MODEL="claude-sonnet-5"
            REASON="${CHANGED} lines (51-500)"
          elif [ "$CHANGED" -le 10000 ]; then
            MODEL="claude-opus-5"
            REASON="${CHANGED} lines (501-10000, complex)"
          else
            MODEL="claude-fable-5"
            REASON="${CHANGED} lines (>10000, frontier)"
          fi
          # Release PRs never get the smallest tier. All three fabricated
          # ancestry false-fails (mcp-host#127, mcp-host#134, untappd-mcp#110,
          # all 2026-08-04) were claude-haiku-4-5 reviewing a release PR — the
          # tiny changelog diff routes there, yet these are the PRs that arm a
          # publish, the highest blast radius per line in the fleet.
          if [ "$MODEL" = "claude-haiku-4-5" ] && [[ "$HEAD_REF" == release-please--* ]]; then
            MODEL="claude-sonnet-5"
            REASON="release PR floor (${REASON})"
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Selected ${MODEL} — ${REASON}"
          echo "**Model:** \`${MODEL}\` — ${REASON}" >> "$GITHUB_STEP_SUMMARY"

      - name: Claude review with structured verdict
        id: review
        # A deterministic ancestry violation IS the verdict — running a model
        # review on top would only produce prose beside a fact the pipeline
        # already established (the verdict step emits the fail directly).
        if: ${{ steps.ancestry.outputs.violations == '' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          # No `github_token:` — the installed Claude App authors comments
          # as claude[bot] via OIDC.
          # track_progress hard-errors on `labeled` events (the action only
          # supports it for opened/synchronize/ready_for_review/reopened).
          track_progress: ${{ github.event.action != 'labeled' }}
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --json-schema '{"type":"object","required":["verdict","summary","important_findings"],"properties":{"verdict":{"enum":["pass","warn","fail"]},"summary":{"type":"string"},"important_findings":{"type":"array","items":{"type":"string"}},"nits":{"type":"array","items":{"type":"string"}}}}'
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git rev-list:*),Bash(git branch --contains:*),Bash(git cat-file:*),Bash(cat:*),Bash(rg:*),Bash(jq:*),Bash(ls:*),Bash(find:*)"
          prompt: |
            You are reviewing pull request #${{ needs.context.outputs.number }} in ${{ github.repository }}.

            STEPS:
            1. Read CLAUDE.md (and README.md if CLAUDE.md is absent) to learn the project's conventions.
            2. Read the PR diff: `gh pr diff ${{ needs.context.outputs.number }}` (or read files in the working tree, which is checked out).
            3. Review the changes for:
               - Correctness and edge cases
               - Adherence to documented conventions
               - Test coverage of new code paths
               - Security or data-integrity concerns

            REPO-SPECIFIC NOTES:
            ${{ inputs.conventions_hint }}

            CONVENTIONS ARE GROUNDED, NOT INVENTED:
            A "convention" exists only if it is (a) written in CLAUDE.md/README.md, (b) enforced by a repo config (linter/formatter/compiler config), or (c) consistently followed by the surrounding code. Before citing a documented rule you MUST be able to quote its exact text. Never infer an unwritten style rule.

            EMPIRICAL CLAIMS ARE EXECUTED, NOT INFERRED:
            A finding that asserts a checkable fact MUST be backed by a command you actually ran during this review, with the command and its relevant output (or exit code) quoted in the finding. In particular:
              - History/reachability claims — "commit X is not on branch Y", "the CHANGELOG documents a change this release doesn't ship", "X is missing from this branch/tag" — verify with `git merge-base --is-ancestor`, `git rev-list`, `git branch --contains`, `git log`, or `git cat-file` (all allowed; the checkout has full history).
              - Absence claims — "no caller exists", "this symbol/file/test is missing" — verify with `rg`/`ls`/`find` and quote the search that came back empty.
            If you cannot run the check — the claim needs a build, a test run, or network access (e.g. "this test would fail", "this endpoint is unreachable", "this doesn't compile", "package X doesn't export Y") — you MUST NOT present the claim as a finding. Raise it as an explicit open question in the summary comment instead: not counted toward the verdict, not listed in `important_findings` or `nits`. An unverified assertion presented as a finding is worse than silence — it blocks a correct change and invites a "fix" that introduces a real defect.
            "Quoted output" means text copied from a tool result returned to you in THIS session. Never write what a command "would" print — reconstructed or remembered output is fabrication even when it happens to look plausible. Note that `git merge-base --is-ancestor` prints NOTHING (it answers via exit code alone), so quote it as `git merge-base --is-ancestor X Y; echo $?` with the actual digit; any prose "output" attributed to it is fabricated on its face.

            CHANGELOG COMMIT INCLUSION IS PIPELINE-OWNED — NEVER YOUR FINDING:
            Before this review ran, a deterministic workflow step ancestry-checked every commit SHA this PR adds to CHANGELOG.md against this PR's HEAD with real `git merge-base --is-ancestor`. Had any been missing, the pipeline would have failed the review itself and you would not be running. The verified facts:
            ${{ steps.ancestry.outputs.report }}
            Therefore claims of the form "this CHANGELOG commit is not included / not an ancestor / missing from the release" are categorically OUT OF SCOPE for you — never a finding, never in `important_findings` or `nits`, regardless of what you believe you checked. Any such finding is discarded by the pipeline and publicly noted as discarded. If you think the table is wrong, say so as an open question in the summary comment; it does not count toward the verdict.

            SEVERITY MODEL (matches the official code-review plugin):
              🔴 Important — bug, broken behavior, security/data risk, or violation of a convention you can QUOTE from the docs. Confidence ≥80 to count.
              🟡 Nit       — a concrete, actionable minor issue grounded in the docs, a linter/formatter config, or a clear inconsistency with adjacent code. Confidence ≥80.
              🟣 Pre-existing — issue already in the codebase, not introduced by this PR. Never blocking.

            OUT OF SCOPE — never a finding, never affects the verdict:
              - Formatting taste a formatter would own: comment length, single- vs multi-line comments, blank lines, line breaks, import order not enforced by a config.
              - Rephrasing comments/identifiers that are already clear.
              - Anything you cannot ground in the docs, a repo config, or adjacent-code style.
              - Pinning a `chrischall/workflows/*` reusable workflow to `@main` instead of a commit SHA. This is the owner's deliberate convention for the fleet's OWN self-controlled reusable-workflow repo (improvements propagate without per-repo SHA bumps); the exposure is self-owned, not a third-party supply-chain risk. Do NOT flag it — this exemption is ONLY for `chrischall/workflows` refs, not third-party actions/workflows.
            If your only findings are out-of-scope, the verdict is `pass`.

            OUTPUT:
            - For line-specific findings, prefer the inline-comment tool (`mcp__github_inline_comment__create_inline_comment`).
            - Post ONE top-level summary comment with overall judgment (use `gh pr comment`). If there are no findings worth surfacing, post a short "No issues found" comment.
            - ALWAYS end that summary comment with a final line `**Verdict:** pass` / `**Verdict:** warn` / `**Verdict:** fail` — every review, findings or not.
            - Then emit your structured verdict per the JSON schema:
              • `pass` — no 🔴 Important findings.
              • `warn` — no 🔴 Important findings but at least one 🟡 Nit worth surfacing.
              • `fail` — at least one 🔴 Important finding.
              Set `summary` to a 1-2 sentence overall judgment.
              Set `important_findings` to the list of 🔴 Important finding titles (empty array if none).
              Set `nits` to the list of 🟡 Nit titles (empty array if none).
            Both `important_findings` and `nits` populate a per-PR follow-up tracking issue verbatim, so make each title a self-contained, actionable one-liner (name the file/symbol where it helps) — not "see inline comment".
            Populate `nits` with EVERY 🟡 Nit you surfaced anywhere — inline comments included — even when your verdict is `pass`. A nit mentioned only in prose is lost; a nit in the array gets a tracking issue regardless of verdict.

            GATING (for your awareness, not your job): `pass` and `warn` both auto-merge — nits do NOT block; they are tracked in the follow-up issue and addressed later. Only `fail` blocks. So reserve `fail` for genuine 🔴 Important findings, and don't inflate a nit to `fail` to "make sure it gets fixed" — the tracking issue already guarantees that.

            DO NOT modify files, push commits, approve the PR formally, or call `gh pr review` / `gh pr edit`. Posting comments and emitting the verdict is the entire job. The workflow will gate auto-merge based on your verdict.

      - name: Surface verdict in run summary
        if: always() && steps.review.outputs.structured_output != ''
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
        run: |
          {
            echo "## Claude review verdict"
            echo ""
            echo "**Verdict:** \`$(echo "$OUT" | jq -r .verdict)\`"
            echo ""
            echo "**Summary:** $(echo "$OUT" | jq -r .summary)"
            echo ""
            COUNT=$(echo "$OUT" | jq -r '.important_findings | length')
            echo "**Important findings:** ${COUNT}"
            if [ "$COUNT" -gt 0 ]; then
              echo ""
              echo "$OUT" | jq -r '.important_findings[] | "- " + .'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Deterministic verdict surfacing: one marker-tagged PR comment, verdict
      # recovered from the review comment when structured_output is empty
      # (known intermittent action bug), loud failure when no verdict exists.
      # Single source of truth: exports `verdict` consumed by the arm step.
      - name: Post verdict to PR
        id: verdict
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.context.outputs.number }}
          REPO: ${{ github.repository }}
          OUT: ${{ steps.review.outputs.structured_output }}
          VIOLATIONS: ${{ steps.ancestry.outputs.violations }}
          EVENT: ${{ github.event_name }}
          # Names the workflow that was initially triggered — the CALLER's
          # stub, not this reusable file — which is the copy the action
          # compares against the default branch.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          verdict=""; summary=""; DISCARD_NOTE=""
          if [ -n "$VIOLATIONS" ]; then
            # Deterministic path: the ancestry step proved the CHANGELOG
            # documents commits this PR does not contain, and the model review
            # was skipped. Synthesize the structured output the rest of the
            # pipeline (verdict comment, follow-up issue) expects.
            OUT=$(jq -nc --arg f "CHANGELOG documents commit(s) not included in this PR: ${VIOLATIONS} — established by the pipeline's deterministic git ancestry check (see the run log); the model review was skipped" \
              '{verdict: "fail", summary: $f, important_findings: [$f], nits: []}')
          elif [ -n "$OUT" ]; then
            # The ancestry table was clean, so any model finding claiming a
            # CHANGELOG commit is missing contradicts a verified git fact —
            # three fabricated incidents of exactly this (mcp-host#127/#134,
            # untappd-mcp#110) are why the pipeline, not the model, owns this
            # claim family. Drop such findings and recompute the verdict from
            # what remains; the comment discloses the discard.
            #
            # Both arrays are scrubbed, not just `important_findings`: a model
            # that demotes an ancestry claim to a nit would otherwise route it
            # straight past pipeline ownership into the follow-up issue, which
            # keys on the combined count and copies nit titles verbatim.
            FILTERED=$(echo "$OUT" | jq -c '
              def ancestry_claim:
                test("not (an |the )?ancestor|ancestors? of (the |this )?(release|branch|pr|head|current)"; "i")
                or (test("changelog"; "i") and test("missing|not (actually )?(includ|ship|present)"; "i"));
              def scrub: (. // []) | map(select(ancestry_claim | not));
              .important_findings = (.important_findings | scrub)
              | .nits = (.nits | scrub)')
            DROPPED=$(jq -rn --argjson a "$OUT" --argjson b "$FILTERED" '
              ((($a.important_findings // []) | length) + (($a.nits // []) | length))
              - (($b.important_findings | length) + ($b.nits | length))' 2>/dev/null || echo 0)
            if [ "$DROPPED" -gt 0 ] 2>/dev/null; then
              # Only a verdict with nothing left to justify it is recomputed: a
              # surviving important finding keeps `fail`, a surviving nit keeps
              # `warn`. `pass` is never escalated.
              OUT=$(echo "$FILTERED" | jq -c '
                if (.important_findings | length) == 0 and .verdict != "pass" then
                  .verdict = (if (.nits | length) > 0 then "warn" else "pass" end)
                else . end')
              DISCARD_NOTE="🛡️ ${DROPPED} finding(s) claiming a CHANGELOG-documented commit is missing from this release were discarded: the pipeline's deterministic git ancestry check verified every referenced commit is an ancestor of this PR (table in the run log)."
            fi
          fi
          if [ -n "$OUT" ]; then
            verdict=$(echo "$OUT" | jq -r '.verdict // empty')
            summary=$(echo "$OUT" | jq -r '.summary // empty')
          fi
          # A PR that EDITS the reviewing workflow cannot be reviewed by the
          # `pull_request` run: that run uses the PR's copy of the workflow,
          # and claude-code-action refuses to execute a workflow file that
          # differs from the one on the default branch. The result is an empty
          # structured output and no review comment — indistinguishable, from
          # here, from a review that fell over, so it used to surface as a bare
          # "no verdict / treat as un-reviewed". That is a dead end for the
          # author: re-running the same job reproduces it every time.
          #
          # The way through already exists — a maintainer's `/auto-review`
          # comment fires `issue_comment`, which GitHub always runs from the
          # DEFAULT branch, so the action sees an unmodified workflow. Say so
          # rather than making each author rediscover it. (Diagnosed the hard
          # way: this exact refusal stalled 78 idle sweep PRs at once.)
          SELF_EDIT=""
          if [ -z "$verdict" ] && [ "$EVENT" != "issue_comment" ]; then
            # owner/repo/.github/workflows/x.yml@refs/... -> .github/workflows/x.yml
            SELF="${WORKFLOW_REF%%@*}"; SELF="${SELF#*/}"; SELF="${SELF#*/}"
            CHANGED=$(gh pr diff "$PR" --repo "$REPO" --name-only 2>/dev/null || true)
            if [ -n "$SELF" ] && printf '%s\n' "$CHANGED" | grep -qxF "$SELF"; then
              SELF_EDIT="This PR modifies \`$SELF\` — the very workflow this run executes. \`claude-code-action\` refuses to run a workflow file that differs from the copy on the default branch, so the \`pull_request\` run cannot review this PR no matter how often it is re-run."
            elif printf '%s\n' "$CHANGED" | grep -q '^\.github/workflows/'; then
              SELF_EDIT="This PR modifies files under \`.github/workflows/\`, which is the usual cause: \`claude-code-action\` refuses to run a workflow file that differs from the copy on the default branch."
            fi
          fi

          if [ -z "$verdict" ]; then
            body=$(gh pr view "$PR" --repo "$REPO" --json comments --jq '[.comments[]|select(.author.login=="claude")]|last|.body' 2>/dev/null || echo "")
            vline=$(printf '%s' "$body" | grep -ioE 'verdict[^a-z]{0,6}(pass|warn|fail)' | tail -1 || true)
            case "$vline" in
              *[Pp]ass*) verdict="pass";;
              *[Ww]arn*) verdict="warn";;
              *[Ff]ail*) verdict="fail";;
            esac
            [ -n "$verdict" ] && summary="(verdict recovered from the review comment — structured output was empty)"
          fi

          # Downstream (the follow-up issue) must see the same findings this
          # step judged on — post-discard, post-synthesis — not the raw model
          # output.
          {
            echo "filtered_output<<FILTERED_EOF"
            printf '%s\n' "$OUT"
            echo "FILTERED_EOF"
          } >> "$GITHUB_OUTPUT"

          # Export before any later command can fail: an empty value reads as
          # "no verdict" downstream, which fails safe (never arms).
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          # A `pass` can still carry structured findings (reviewer surfaced
          # nits but judged them not worth `warn`) — the follow-up step keys
          # on this so those nits get a tracking issue too.
          FINDINGS=0
          if [ -n "$OUT" ]; then
            FINDINGS=$(echo "$OUT" | jq -r '((.important_findings // []) | length) + ((.nits // []) | length)' 2>/dev/null || echo 0)
          fi
          if [ "$FINDINGS" -gt 0 ] 2>/dev/null; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

          MARKER="<!-- auto-review-verdict -->"
          if [ -n "$verdict" ]; then
            case "$verdict" in pass) ICON="✅";; warn) ICON="🟡";; fail) ICON="🔴";; esac
            NEW_BODY="$MARKER
          $ICON Auto-review verdict: **$verdict**${summary:+ — $summary}${DISCARD_NOTE:+
          $DISCARD_NOTE}"
          elif [ -n "$SELF_EDIT" ]; then
            NEW_BODY="$MARKER
          ⚠️ Auto-review issued **no verdict** — and this is expected here, not a failure of the review.

          $SELF_EDIT

          **To review this PR:** a maintainer comments \`/auto-review\`. That fires \`issue_comment\`, which GitHub always runs from the default branch, so the action sees an unmodified workflow and the review proceeds against this PR's head.

          Until then, treat this PR as un-reviewed."
          else
            NEW_BODY="$MARKER
          ⚠️ Auto-review issued **no verdict** — structured output was empty and no verdict line was found in the review comment. Treat this PR as un-reviewed."
          fi

          # One comment per PR, updated in place on re-reviews (marker-matched).
          # Marker is inlined in the jq program: gh --jq has no --arg support.
          # head -n1 because --paginate runs the jq filter per page.
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-review-verdict -->"))][0].id // empty' \
            | grep . | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$NEW_BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$NEW_BODY" >/dev/null
          fi

          if [ -z "$verdict" ]; then
            if [ -n "$SELF_EDIT" ]; then
              # Still a failure — the PR is genuinely un-reviewed and must not
              # arm — but name the route out, so the red X is actionable
              # instead of a re-run loop.
              echo "::error::auto-review emitted no verdict: this PR edits the workflow that reviews it, so the pull_request run cannot review it. A maintainer should comment /auto-review to re-run from the default branch."
            else
              echo "::error::auto-review completed without emitting a verdict"
            fi
            exit 1
          fi

      # Any surfaced finding is worth keeping — warn/fail verdicts, but also a
      # `pass` whose structured output lists nits (reviewers do emit
      # pass-with-nits despite the verdict rubric; observed on gemini-mcp#46).
      # Capture them in ONE issue per PR (idempotent via a hidden marker) so
      # nits can ride along on an auto-merged PR without being lost, and `fail`
      # findings have a durable home while the PR is iterated.
      - name: Open or update follow-up issue
        id: followup
        # Best-effort: GitHub runs `run:` with `bash -eo pipefail`, so an
        # unguarded gh API failure (rate-limit, transient 5xx) would abort the
        # step and mark the JOB failed — while the arm step still runs on
        # !cancelled() and adds ready-to-merge, a contradictory red-job +
        # armed-PR state. continue-on-error keeps issue tracking auxiliary to
        # the load-bearing verdict/arm contract.
        continue-on-error: true
        if: ${{ !cancelled() && (steps.verdict.outputs.verdict == 'warn' || steps.verdict.outputs.verdict == 'fail' || (steps.verdict.outputs.verdict == 'pass' && steps.verdict.outputs.has_findings == 'true')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.context.outputs.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ needs.context.outputs.title }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          # Post-discard/post-synthesis findings from the verdict step — the
          # raw model output may contain findings the pipeline overruled.
          OUT: ${{ steps.verdict.outputs.filtered_output }}
          # Stamped into the body so a reader can tell whether a re-listed
          # finding was judged against their fix or against an older commit.
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER="<!-- auto-review-followup:PR-${PR} -->"

          # Ensure the tracking label exists (idempotent).
          gh label create auto-review-followup --repo "$REPO" \
            --color FBCA04 --description "Auto-review findings to address" 2>/dev/null || true

          # One issue per PR: find an open one carrying this PR's marker (filter
          # out PRs, which the issues endpoint also returns). Resolved BEFORE
          # the body is built — the existing body is an input to it.
          EXISTING=$(gh api "repos/$REPO/issues?state=open&labels=auto-review-followup&per_page=100" --paginate \
            --jq "[.[] | select(.pull_request == null) | select(.body != null and (.body | contains(\"$MARKER\"))) | .number][0] // empty" \
            | grep . | head -n1 || true)

          # Every review round REGENERATES this body, which used to silently
          # un-tick every box a human had ticked (#139): on mcp-host#326 three
          # verified fixes came back unchecked because a later round reviewed a
          # two-commits-stale diff, so the issue reported work that was already
          # done and pushed. Carry the prior tick state forward.
          CHECKED=/tmp/followup-checked.txt
          : > "$CHECKED"
          if [ -n "$EXISTING" ]; then
            gh issue view "$EXISTING" --repo "$REPO" --json body --jq '.body // ""' \
              > /tmp/followup-old.md 2>/dev/null || : > /tmp/followup-old.md
            grep -oE '^- \[[xX]\] .+' /tmp/followup-old.md | sed -E 's/^- \[[xX]\] //' > "$CHECKED" || true
          fi

          # Exact whole-line match only. A tick means "a human verified THIS
          # sentence"; carrying it onto a reworded finding would manufacture a
          # done-mark for something nobody has looked at, which is the failure
          # this step exists to prevent, inverted.
          box() { if grep -qxF -- "$1" "$CHECKED"; then printf 'x'; else printf ' '; fi; }

          # Build the checklist body. Prefer structured findings; fall back to a
          # pointer at the PR's review comments when structured output is empty.
          {
            echo "$MARKER"
            echo ""
            echo "Tracking auto-review follow-ups for #${PR} (verdict: **${VERDICT}**)."
            echo ""
            imp=""; nits=""
            if [ -n "$OUT" ]; then
              imp=$(echo "$OUT" | jq -r '.important_findings // [] | .[]' 2>/dev/null || true)
              nits=$(echo "$OUT" | jq -r '.nits // [] | .[]' 2>/dev/null || true)
            fi
            if [ -n "$imp" ]; then
              echo "### 🔴 Important"
              printf '%s\n' "$imp" | while IFS= read -r f; do
                if [ -n "$f" ]; then echo "- [$(box "$f")] $f"; fi
              done
              echo ""
            fi
            if [ -n "$nits" ]; then
              echo "### 🟡 Nits"
              printf '%s\n' "$nits" | while IFS= read -r f; do
                if [ -n "$f" ]; then echo "- [$(box "$f")] $f"; fi
              done
              echo ""
            fi
            if [ -z "$imp" ] && [ -z "$nits" ]; then
              echo "_No structured findings were captured; see the review comments on #${PR}._"
              echo ""
            fi
            echo "---"
            echo "Checklist regenerated from the auto-review of \`${HEAD_SHA:0:7}\` ([run](${RUN_URL})). Ticks survive later rounds, but a round that reviewed an older commit can still re-list something already fixed — check that SHA before redoing an item."
            echo ""
            echo "When addressing the review on #${PR}, resolve each item and add \`Closes #<this issue>\` to the PR once everything is genuinely fixed; deferred items stay open here. See the auto-review follow-up convention in CLAUDE.md."
          } > /tmp/followup-body.md

          TITLE="Auto-review follow-ups for PR #${PR}: ${PR_TITLE}"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body-file /tmp/followup-body.md >/dev/null
            NUM="$EXISTING"
            echo "Updated follow-up issue #${NUM}."
          else
            URL=$(gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/followup-body.md --label auto-review-followup)
            NUM="${URL##*/}"
            echo "Opened follow-up issue #${NUM}: ${URL}"
          fi
          [ -n "$NUM" ] && echo "issue=$NUM" >> "$GITHUB_OUTPUT"

          # Prominently link the issue from the verdict marker comment so it is
          # the first thing seen when addressing the PR. Drop any stale pointer
          # line first, then append the fresh one (no leading indentation, or
          # GitHub would render it as a code block).
          CMARKER="<!-- auto-review-verdict -->"
          CID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body != null and (.body | startswith(\"$CMARKER\")))][0].id // empty" \
            | grep . | head -n1 || true)
          if [ -n "$CID" ] && [ -n "$NUM" ]; then
            CUR=$(gh api "repos/$REPO/issues/comments/$CID" --jq '.body')
            CLEAN=$(printf '%s\n' "$CUR" | grep -v '^📋 Tracking follow-ups:' || true)
            NEWC=$(printf '%s\n📋 Tracking follow-ups: #%s' "$CLEAN" "$NUM")
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$NEWC" >/dev/null
          fi

      # A later review pass that finds NOTHING is the signal that the earlier
      # findings were actually addressed — a stronger one than a human
      # remembering to edit the PR body. Wire that up so the tracking issue
      # closes itself on merge.
      #
      # Why append `Closes #N` to the PR body rather than closing the issue
      # here: the fix is not on the default branch yet. Closing now would mark
      # findings resolved while the PR could still be abandoned or reverted.
      # The keyword defers closure to the merge, which is when it becomes true.
      #
      # Deliberately NOT done on warn/fail: the convention is that deferred
      # items stay open, and only a clean re-review proves nothing was
      # deferred. A blanket close-on-merge would silently bury nits the
      # pipeline is meant to carry forward.
      - name: Link a cleared follow-up issue for closure on merge
        # Auxiliary, like the issue-tracking step above: a gh hiccup must not
        # fail the job while the arm step still runs on !cancelled(), which
        # would leave a red job on an armed PR.
        continue-on-error: true
        if: ${{ !cancelled() && steps.verdict.outputs.verdict == 'pass' && steps.verdict.outputs.has_findings != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.context.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- auto-review-followup:PR-${PR} -->"

          # Same lookup the create step uses: one open issue carrying this PR's
          # marker. `select(.pull_request == null)` because the issues endpoint
          # returns PRs too.
          NUM=$(gh api "repos/$REPO/issues?state=open&labels=auto-review-followup&per_page=100" --paginate \
            --jq "[.[] | select(.pull_request == null) | select(.body != null and (.body | contains(\"$MARKER\"))) | .number][0] // empty" \
            | grep . | head -n1 || true)

          if [ -z "$NUM" ]; then
            echo "Clean review and no open follow-up issue for #${PR} — nothing to link."
            exit 0
          fi

          BODY=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""')

          # Idempotent: re-running must not append a second keyword. Match the
          # whole set GitHub honors, any case, so a hand-written "Fixes #12"
          # is respected instead of duplicated.
          # \b on both flanks: without the left one, "discloses #12" and
          # "prefixes #12" read as closing keywords, and the step silently
          # skips appending the real `Closes #12` (issue #96).
          if printf '%s' "$BODY" | grep -qiE "\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #${NUM}\b"; then
            echo "PR #${PR} already references issue #${NUM} with a closing keyword."
            exit 0
          fi

          printf '%s\n\nCloses #%s\n' "$BODY" "$NUM" > /tmp/pr-body.md
          gh pr edit "$PR" --repo "$REPO" --body-file /tmp/pr-body.md >/dev/null
          echo "Re-review came back clean — linked #${NUM} to close when #${PR} merges."

          gh issue comment "$NUM" --repo "$REPO" --body \
            "Re-review of #${PR} came back clean with no findings, so this is linked to close when that PR merges. If anything here was deliberately deferred rather than fixed, reopen and note which item." >/dev/null || true

      - name: Arm auto-merge on pass or warn
        # `ready-to-merge` MUST be added with the PAT: GitHub suppresses
        # workflow runs for GITHUB_TOKEN-triggered events, so a label added
        # that way would not fire the auto-merge workflow.
        # `warn` arms too (nits don't block — tracked via the follow-up issue);
        # only `fail` keeps the human-in-the-loop gate.
        # NEVER arms a fork. A fork PR can now be reviewed (via a maintainer's
        # `/auto-review`), but the verdict is information only — `ready-to-merge`
        # stays a human action, and since the arm-gate defers un-armed fork CI,
        # not arming also means a fork's build never starts on a verdict alone.
        if: ${{ !cancelled() && needs.context.outputs.is_fork == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.release_pat }}
          PR: ${{ needs.context.outputs.number }}
          REPO: ${{ github.repository }}
          # Empty if the verdict step failed before exporting — never arms.
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          if [ "$VERDICT" = "pass" ] || [ "$VERDICT" = "warn" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label ready-to-merge
            echo "Verdict=$VERDICT — added ready-to-merge to arm auto-merge."
          else
            echo "Verdict=${VERDICT:-unknown} — not arming (human-in-the-loop preserved)."
          fi
