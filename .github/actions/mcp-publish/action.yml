name: MCP publish
description: >-
  Publish a released MCP server: npm (trusted publishing/provenance),
  .skill + .mcpb artifacts, MCP Registry, ClawHub. Run inside the repo's
  own release-please.yml publish job AFTER checking out the release tag.
  The job needs `contents: write` and `id-token: write`.

inputs:
  version:
    description: Release version (from release-please outputs)
    required: true
  tag-name:
    description: Release tag (from release-please outputs)
    required: true
  package-name:
    description: Artifact/skill base name; defaults to the repository name
    required: false
    default: ""
  skill-path:
    description: >-
      Path to a single skill's SKILL.md, pinning publication to just that one.
      When empty, auto-resolves to a root SKILL.md, else EVERY skills/*/SKILL.md
      — a repo shipping several publishes them all, each under its own slug.
    required: false
    default: ""
  node-version:
    description: Node version for the publish toolchain
    required: false
    default: "26"
  publish-npm:
    required: false
    default: "true"
  publish-skill:
    required: false
    default: "true"
  publish-mcpb:
    required: false
    default: "true"
  publish-registry:
    required: false
    default: "true"
  publish-clawhub:
    required: false
    default: "true"
  clawhub-token:
    description: ClawHub token; skipped when empty
    required: false
    default: ""
  github-token:
    description: Token for `gh release upload`
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        registry-url: https://registry.npmjs.org

    # Strip always-auth from .npmrc (set by setup-node, deprecated in npm 11)
    - shell: bash
      run: sed -i '/always-auth/d' "$NPM_CONFIG_USERCONFIG"

    - shell: bash
      run: npm ci
    - shell: bash
      run: npm run build

    - name: Resolve names
      shell: bash
      env:
        IN_NAME: ${{ inputs.package-name }}
        VERSION: ${{ inputs.version }}
      run: |
        NAME="${IN_NAME:-${GITHUB_REPOSITORY##*/}}"
        echo "MCP_PUBLISH_NAME=$NAME" >> "$GITHUB_ENV"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    # Plugin-shaped repos keep SKILL.md under skills/<name>/; standalone repos
    # keep it at the root, and a repo may ship several. Resolve once into a
    # manifest ($SKILLS_TSV) that the packaging, ClawHub and attach steps iterate.
    - name: Resolve skill path
      shell: bash
      env:
        IN_SKILL_PATH: ${{ inputs.skill-path }}
      run: |
        # Emits a manifest at $SKILLS_TSV: one "path<TAB>slug" line per skill.
        # A repo may ship several (zola-mcp has zola + zola-api); publishing only
        # the first would silently drop the rest, and erroring — as this used to —
        # broke publishing outright: zola-mcp tagged 1.6.0/1.6.1/1.6.2 while npm
        # stayed at 1.5.0, because this step exits before the npm publish.
        SKILLS_TSV="$RUNNER_TEMP/skills.tsv"
        : > "$SKILLS_TSV"

        add() { printf '%s\t%s\n' "$1" "$2" >> "$SKILLS_TSV"; }

        if [ -n "$IN_SKILL_PATH" ]; then
          if [ ! -f "$IN_SKILL_PATH" ]; then
            echo "skill-path input '$IN_SKILL_PATH' does not exist." >&2
            exit 1
          fi
          # Explicit override stays single and keeps the repo-level slug, so a
          # repo pinning one skill of several publishes exactly what it pinned.
          add "$IN_SKILL_PATH" "$MCP_PUBLISH_NAME"
        elif [ -f SKILL.md ]; then
          add "SKILL.md" "$MCP_PUBLISH_NAME"
        else
          shopt -s nullglob
          # Two layouts, tried in order. A plugin-shaped repo keeps its skills
          # under skills/<name>/; a workspace monorepo ships one per package,
          # and that second layout used to resolve to NOTHING — the glob missed
          # it, the count came out 0, and the release went green with every
          # skill absent. gogcli-mcp published 1 of its 9 that way.
          #
          # Order matters more than the addition does: packages/*/ is only
          # consulted when skills/*/ finds nothing, and neither is consulted
          # when a root SKILL.md exists. A repo that resolves skills today
          # resolves exactly the same ones after this, because changing a slug
          # orphans its ClawHub listing and renames its release artifact.
          #
          # Both globs are single-level on purpose: packages/*/SKILL.md cannot
          # reach packages/<pkg>/node_modules/<dep>/SKILL.md, so a dependency's
          # own skill is never published under our slug.
          PREFIX=skills/
          CANDIDATES=(skills/*/SKILL.md)
          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            PREFIX=packages/
            CANDIDATES=(packages/*/SKILL.md)
          fi
          if [ "${#CANDIDATES[@]}" -eq 1 ]; then
            # Single skill keeps the repo-level slug and artifact name, byte for
            # byte, so existing releases and ClawHub listings are undisturbed.
            add "${CANDIDATES[0]}" "$MCP_PUBLISH_NAME"
          else
            # Several: each gets its own slug from its directory name, otherwise
            # they would collide on one ClawHub slug and one artifact filename.
            for c in "${CANDIDATES[@]}"; do
              d="${c%/SKILL.md}"
              add "$c" "${d#"$PREFIX"}"
            done
          fi
        fi

        COUNT=$(wc -l < "$SKILLS_TSV" | tr -d ' ')
        echo "SKILLS_TSV=$SKILLS_TSV" >> "$GITHUB_ENV"
        echo "SKILL_COUNT=$COUNT" >> "$GITHUB_ENV"
        if [ "$COUNT" -eq 0 ]; then
          echo "No SKILL.md found."
        else
          echo "Resolved $COUNT skill(s):"
          while IFS=$'\t' read -r p slug; do echo "  $slug  <-  $p"; done < "$SKILLS_TSV"
        fi

    - name: Package skill
      if: inputs.publish-skill == 'true'
      shell: bash
      run: |
        if [ "${SKILL_COUNT:-0}" -eq 0 ]; then
          echo "No SKILL.md found — skipping skill packaging."
          exit 0
        fi
        python3 - <<'EOF'
        import zipfile, pathlib, os

        version = os.environ["VERSION"]
        manifest = pathlib.Path(os.environ["SKILLS_TSV"])
        repo_root = pathlib.Path.cwd().resolve()

        # One archive per skill, named by its slug. With a single skill the slug
        # is the repo-level name, so the artifact filename is unchanged.
        for line in manifest.read_text().splitlines():
            if not line.strip():
                continue
            path, slug = line.split("\t", 1)
            skill_md = pathlib.Path(path)
            skill_dir = skill_md.parent.resolve()
            out = pathlib.Path(f"{slug}-{version}.skill")

            # A skill under skills/<name>/ owns its whole directory: SKILL.md
            # plus references/, scripts, assets. Packaging only SKILL.md ships a
            # skill whose own text points at files that are not in the archive.
            # A root SKILL.md has no directory of its own — that is the repo —
            # so only the file itself goes in.
            members = []
            if skill_dir != repo_root:
                members = sorted(f for f in skill_dir.rglob("*") if f.is_file())
            else:
                members = [skill_md]

            with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
                for f in members:
                    rel = f.name if skill_dir == repo_root else f.relative_to(skill_dir)
                    zf.write(f, f"{slug}/{rel}")
            extra = len(members) - 1
            print(f"Packaged {out} ({out.stat().st_size} bytes, "
                  f"{len(members)} file(s){f', {extra} beyond SKILL.md' if extra else ''})")
        EOF

    # Resolve which package directories to publish — shared by the npm, .mcpb and
    # MCP-Registry steps below. A single-package repo publishes its own root
    # ("."), unchanged. A workspace monorepo marks its root private and ships the
    # packages under `packages/*`; publish each non-private workspace instead of
    # skipping on the private root (the "green tag ≠ green publish" trap that
    # froze several monorepos on npm/registry while their tags advanced).
    #
    # Capture via command substitution, NOT process substitution: `< <(node …)`
    # discards node's exit code, so a FAILED `npm query` (bad npm version,
    # transient error, polluted stdout) would look identical to "nothing to
    # publish" and skip silently — re-creating the very bug this fixes.
    - name: Resolve publish dirs
      # Only when something downstream consumes the list — a caller that
      # disabled npm/.mcpb/registry shouldn't pay for `npm query` or be failed
      # by a transient resolver error for steps it isn't running.
      if: inputs.publish-npm == 'true' || inputs.publish-mcpb == 'true' || inputs.publish-registry == 'true'
      shell: bash
      run: |
        if ! DIRS_RAW=$(node -e '
          const cp = require("child_process");
          const root = require("./package.json");
          if (root.private !== true) { console.log("."); process.exit(0); }
          let ws;
          try { ws = JSON.parse(cp.execSync("npm query .workspace", { encoding: "utf8" })); }
          catch (e) { console.error("npm query .workspace failed: " + e.message); process.exit(1); }
          for (const w of ws) if (w.private !== true && w.location) console.log(w.location);
        '); then
          echo "Failed to resolve publishable packages — refusing to skip silently." >&2
          exit 1
        fi
        OUT="$RUNNER_TEMP/publish_dirs.txt"
        printf '%s\n' "$DIRS_RAW" | grep -v '^[[:space:]]*$' > "$OUT" || true
        echo "PUBLISH_DIRS_FILE=$OUT" >> "$GITHUB_ENV"
        COUNT=$(wc -l < "$OUT" | tr -d ' ')
        if [ "$COUNT" -eq 0 ]; then
          echo "Private root with no public workspaces — nothing to publish."
        else
          echo "Resolved $COUNT publishable package dir(s):"; sed 's/^/  /' "$OUT"
        fi

    - name: Build .mcpb bundle
      if: inputs.publish-mcpb == 'true'
      shell: bash
      run: |
        # One .mcpb per package that ships a manifest.json, collected at the
        # workspace root as <pkg>-<version>.mcpb for the attach step to glob.
        # For the single-package (".") case, NAME stays MCP_PUBLISH_NAME so the
        # asset filename is byte-for-byte what it was before.
        [ -s "$PUBLISH_DIRS_FILE" ] || { echo "No packages resolved — skipping .mcpb."; exit 0; }
        OUTDIR="$GITHUB_WORKSPACE"
        rc=0
        while IFS= read -r dir; do
          [ -n "$dir" ] || continue
          ( cd "$dir"
            if [ ! -f manifest.json ]; then
              echo "manifest.json not present in $dir — skipping .mcpb."
              exit 0
            fi
            if [ "$dir" = "." ]; then NAME="$MCP_PUBLISH_NAME"; else NAME=$(node -p "require('./package.json').name"); fi
            # Sanitize the name for use in a FILE path: a scoped package name
            # like @org/pkg contains a '/', which would make `mv` target a
            # nonexistent @org/ subdirectory. Drop the leading '@' and turn '/'
            # into '-' (@org/pkg -> org-pkg), collision-free across scopes. For
            # the single-package (".") case NAME is the unscoped repo name, so
            # this is a no-op and the asset filename is unchanged.
            SAFE=$(printf '%s' "$NAME" | sed 's#^@##; s#/#-#g')
            # Checked explicitly rather than left to `set -e`: this subshell is
            # the left operand of `|| rc=1`, and bash disables errexit inside a
            # tested context. A failing pack therefore did NOT abort here — `mv`
            # went on to fail with "cannot stat ''" and the unconditional echo
            # below reported a bundle that was never built, over a green job.
            # remind-mcp and angi-mcp each shipped releases with no .mcpb that way.
            if ! npx @anthropic-ai/mcpb pack; then
              echo "::error title=mcpb pack failed::$dir — manifest invalid or pack errored"
              exit 1
            fi
            # pack writes <manifest name>.mcpb into cwd; rename the file it made
            # rather than assuming its name.
            built=$(ls -t ./*.mcpb 2>/dev/null | head -1)
            if [ -z "$built" ]; then
              echo "::error title=mcpb pack produced nothing::no .mcpb in $dir after a successful pack"
              exit 1
            fi
            mv "$built" "$OUTDIR/${SAFE}-${VERSION}.mcpb"
            echo "Built ${SAFE}-${VERSION}.mcpb"
          ) || rc=1
        done < "$PUBLISH_DIRS_FILE"
        exit "$rc"

    # Idempotent: skip if this version is already on the registry.
    - name: Publish to npm
      if: inputs.publish-npm == 'true'
      shell: bash
      env:
        # npm rejects --provenance from private source repos; trusted
        # publishing (OIDC auth) itself works either way.
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        # Publish one package directory (idempotent: skip if this exact version
        # is already on the registry). Runs in a subshell so `cd` doesn't leak.
        publish_dir() {
          cd "$1"
          local PKG PUBLISHED
          PKG=$(node -p "require('./package.json').name")
          PUBLISHED=$(npm view "${PKG}@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "npm already has ${PKG}@${VERSION} — skipping."
            return 0
          fi
          if [ "$REPO_PRIVATE" = "true" ]; then
            echo "Publishing ${PKG}@${VERSION} (no provenance; private source repo)…"
            npm publish --access public
          else
            echo "Publishing ${PKG}@${VERSION} with provenance…"
            npm publish --access public --provenance
          fi
        }

        # The publishable dirs were resolved once by the "Resolve publish dirs"
        # step. An empty list means a private root with no public workspaces —
        # a genuine nothing-to-publish, distinct from a resolver failure (which
        # hard-fails that step).
        if [ ! -s "$PUBLISH_DIRS_FILE" ]; then
          echo "No publishable packages — skipping npm publish."
          exit 0
        fi
        rc=0
        while IFS= read -r dir; do
          [ -n "$dir" ] && { ( publish_dir "$dir" ) || rc=1; }
        done < "$PUBLISH_DIRS_FILE"
        exit "$rc"

    - name: Check for server.json
      id: registry-check
      if: inputs.publish-registry == 'true'
      shell: bash
      run: |
        # Present if ANY publishable package ships a server.json (the root for a
        # single-package repo, or any packages/* workspace for a monorepo).
        present=false
        if [ -s "$PUBLISH_DIRS_FILE" ]; then
          while IFS= read -r dir; do
            [ -n "$dir" ] && [ -f "$dir/server.json" ] && { present=true; break; }
          done < "$PUBLISH_DIRS_FILE"
        fi
        echo "present=$present" >> "$GITHUB_OUTPUT"
        [ "$present" = "true" ] || echo "No server.json in any package — skipping MCP Registry publish."

    # npm ACCEPTS a publish and indexes it asynchronously. `+ pkg@version` in
    # the log and a signed provenance statement both mean accepted, NOT
    # queryable — npm says so itself ("Your package is being processed and may
    # take a few minutes to become available"). The MCP Registry refuses to
    # register a version it cannot see on npm:
    #
    #   registry validation failed for package 0 (<pkg>): NPM package '<pkg>'
    #   exists, but version '<v>' was not found (status: 404)
    #
    # so publishing to the registry in the next breath is a race the registry
    # loses. gogcli-mcp 2.28.0 lost it: eight packages indexed fast enough, and
    # gogcli-mcp-classroom did not, 40 seconds after a publish that had already
    # succeeded. Wait for what we just published to actually be readable before
    # asking anyone else to read it.
    #
    # Deliberately queries the registry over HTTP rather than `npm view`: npm
    # answers from its own cache, which is the very staleness being waited out.
    - name: Wait for npm to index published versions
      if: inputs.publish-npm == 'true' && inputs.publish-registry == 'true' && steps.registry-check.outputs.present == 'true'
      shell: bash
      run: |
        # One shared budget for the whole wait, not per package: what matters is
        # that the registry step starts soon after npm is ready, and packages
        # index in parallel on npm's side anyway. Overridable because 10 minutes
        # is a guess at npm's tail latency, not a measured constant.
        BUDGET="${NPM_INDEX_TIMEOUT_SECONDS:-600}"
        INTERVAL="${NPM_INDEX_POLL_SECONDS:-15}"
        deadline=$(( SECONDS + BUDGET ))

        # Only the packages the registry step will actually submit need to be
        # readable; a package with no server.json is never validated.
        while IFS= read -r dir; do
          [ -n "$dir" ] || continue
          [ -f "$dir/server.json" ] || continue
          PKG=$(node -p "require('$PWD/$dir/package.json').name")
          # A scoped name's slash must be percent-encoded in the registry path.
          URL="https://registry.npmjs.org/${PKG//\//%2f}"
          # Timeouts are load-bearing, not hygiene: the deadline below is only
          # evaluated BETWEEN polls, so a stalled connection blocks inside curl
          # and the bounded wait stops being bounded. curl's default is to wait
          # forever, and the job would burn to the Actions timeout and be
          # CANCELLED — which also skips the `!cancelled()` artifact attach, so
          # a hang here costs the release the very assets that guard exists to
          # protect. Matches reusable-fly-deploy.yml, which bounds its poll too.
          #
          # The abbreviated packument is a third of the size of the full one and
          # still carries `versions`, so there is less response to stall on.
          until curl -fsS --connect-timeout 10 --max-time 60 \
            -H 'Accept: application/vnd.npm.install-v1+json' "$URL" 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.exit(JSON.parse(s).versions?.[process.argv[1]]?0:1)}catch{process.exit(1)}})' "$VERSION"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              # Deliberately not fatal. The registry step is the single authority
              # on registry success, and failing here would replace its precise
              # error with a vaguer one for no gain.
              echo "::warning title=npm indexing timed out::${PKG}@${VERSION} was not readable on npm before the ${BUDGET}s budget ran out; the MCP Registry publish may 404"
              break
            fi
            echo "Waiting for ${PKG}@${VERSION} to appear on npm…"
            sleep "$INTERVAL"
          done
        done < "$PUBLISH_DIRS_FILE"

    - name: Install mcp-publisher
      if: inputs.publish-registry == 'true' && steps.registry-check.outputs.present == 'true'
      uses: chrischall/workflows/.github/actions/install-mcp-publisher@main

    - name: Authenticate to MCP Registry (OIDC)
      if: inputs.publish-registry == 'true' && steps.registry-check.outputs.present == 'true'
      shell: bash
      run: mcp-publisher login github-oidc

    # Idempotent, like the npm step above and for the same reason: a release
    # that fails partway is recovered by re-running this workflow, so every
    # step in it has to tolerate the work it already did.
    - name: Publish to MCP Registry
      if: inputs.publish-registry == 'true' && steps.registry-check.outputs.present == 'true'
      shell: bash
      run: |
        # Publish each package that ships a server.json (mcp-publisher reads it
        # from the cwd). Login happened once in the previous step.
        #
        # `cannot publish duplicate version` is SUCCESS, not failure: it means
        # the registry already holds exactly what this run set out to publish.
        # Treating it as an error made the documented recovery unreachable —
        # gogcli-mcp v2.28.0 lost one package to an npm indexing race, and the
        # re-run that fixed it then failed on the five that had already
        # succeeded, so the run went red with the registry fully correct and
        # the release still missing every artifact.
        rc=0
        while IFS= read -r dir; do
          [ -n "$dir" ] || continue
          [ -f "$dir/server.json" ] || continue
          echo "Publishing $dir/server.json to the MCP Registry…"
          # `|| prc=$?` rather than a bare assignment: under `bash -e` — the
          # shell GitHub gives a run block — an assignment whose command
          # substitution fails aborts the step, stranding every package after
          # the first failure. Caught by scripts/mcp-registry-publish.test.sh.
          prc=0
          out=$( cd "$dir" && mcp-publisher publish 2>&1 ) || prc=$?
          printf '%s\n' "$out"
          if [ "$prc" -ne 0 ]; then
            if grep -q 'cannot publish duplicate version' <<<"$out"; then
              echo "Registry already has this version — treating as published."
            else
              rc=1
            fi
          fi
        done < "$PUBLISH_DIRS_FILE"
        exit "$rc"

    # `secrets.*` is not addressable in composite steps; token arrives as an
    # input and the emptiness check happens in the run block.
    # `!cancelled()` rather than the default `success()`: ClawHub has no
    # dependency on npm or the MCP Registry, so a failure over there must not
    # silently skip it. See the attach step below for what that cost.
    - name: Publish skill to ClawHub
      if: ${{ !cancelled() && inputs.publish-clawhub == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        CLAWHUB_TOKEN: ${{ inputs.clawhub-token }}
      run: |
        if [ -z "$CLAWHUB_TOKEN" ]; then
          echo "clawhub-token not set — skipping ClawHub publish."
          exit 0
        fi
        if [ "${SKILL_COUNT:-0}" -eq 0 ]; then
          echo "No SKILL.md found — skipping ClawHub publish."
          exit 0
        fi
        npx --yes clawhub login --token "$CLAWHUB_TOKEN" --no-browser
        # ClawHub `publish` rejects plugin-shaped folders; publish each SKILL.md
        # from a clean temp dir as a standalone skill, under its own slug —
        # reusing one slug would have each skill overwrite the last.
        FAILED=0
        while IFS=$'\t' read -r SKILL_PATH SLUG; do
          [ -n "$SKILL_PATH" ] || continue
          SKILL_DIR=$(mktemp -d)
          SRC_DIR=$(dirname "$SKILL_PATH")
          if [ "$SRC_DIR" = "." ]; then
            cp "$SKILL_PATH" "$SKILL_DIR/SKILL.md"
          else
            # Whole directory: a skill's references/ and scripts are part of it,
            # and shipping SKILL.md alone publishes a skill that points at files
            # the reader does not have.
            cp -R "$SRC_DIR/." "$SKILL_DIR/"
          fi
          # --name is REQUIRED, not decorative. Without it ClawHub derives the
          # listing's display name from the folder basename — and that folder is
          # the mktemp -d above, so every skill the fleet has ever published is
          # listed as "Tmp.KB654L59FE" or similar. Verified with
          # `clawhub publish --dry-run --json`: no --name gives
          # "displayName": "Tmp.X3JS6uYyx7"; with it, the slug.
          echo "Publishing $SLUG to ClawHub..."
          npx --yes clawhub publish "$SKILL_DIR" --version "${VERSION}" --slug "${SLUG}" --name "${SLUG}" || {
            echo "::warning title=ClawHub publish failed::$SLUG did not publish"
            FAILED=1
          }
        done < "$SKILLS_TSV"
        exit $FAILED

    # release-please already created the GitHub Release; attach artifacts.
    #
    # `!cancelled()` is load-bearing. These artifacts are built locally in this
    # job and depend on nothing upstream, but with the default `success()` any
    # earlier failure skips this step and the release ships with ZERO assets —
    # no .mcpb, no .skill — for a reason entirely unrelated to them. gogcli-mcp
    # v2.28.0 shipped exactly that: one transient MCP Registry 404 on one of
    # nine packages, and the whole release lost its artifacts and its ClawHub
    # publish. The job still fails on the earlier step, so the failure stays
    # visible; what changes is that a partial failure stops taking hostages.
    - name: Attach artifacts to release
      if: ${{ !cancelled() }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag-name }}
      run: |
        ARGS=()
        # Glob rather than name one file: a multi-skill repo produces one
        # archive per skill, and hardcoding the repo name would attach only one.
        shopt -s nullglob
        for f in *-"${VERSION}".skill; do ARGS+=("$f"); done
        # Glob rather than name one file: a monorepo produces one .mcpb per
        # package (<pkg>-<version>.mcpb), and hardcoding the repo name attached
        # only one. For a single-package repo this still matches exactly the one
        # ${MCP_PUBLISH_NAME}-${VERSION}.mcpb it built.
        for f in *-"${VERSION}".mcpb; do ARGS+=("$f"); done
        if [ "${#ARGS[@]}" -eq 0 ]; then
          echo "No artifacts to attach."
          exit 0
        fi
        gh release upload "$TAG" "${ARGS[@]}" --clobber
