name: Credit external contributors
description: >
  Append `(thanks @user)` to entries whose PR came from outside the repo owner
  — in BOTH the CHANGELOG.md on the release-please PR branch and the release
  PR's own description.

  The body matters as much as the file: release-please writes the PR
  description from its own notes and never re-reads the branch, so amending
  only the file left the credit invisible everywhere a person actually looks —
  the release PR, and the GitHub Release notes cut from it.

  Runs AFTER release-please in the same job, because release-please force-pushes
  its branch on every run and regenerates the changelog from commits — so the
  amendment has to be re-applied each time rather than made once. It is
  idempotent: an entry already carrying a credit is left alone.

  Why not do this by rewriting the PR title at open time: GitHub squashes a
  SINGLE-commit PR using the COMMIT subject, not the PR title, so a
  title-rewriting bot silently fails on exactly the small one-commit PRs
  external contributors usually send. Amending the changelog reads the merged
  PR's author directly and is unaffected by how the squash subject was chosen.

  "External" is decided by GitHub, not by a list we maintain: a PR is credited
  only when `author_association` is NOT one of OWNER / MEMBER / COLLABORATOR,
  and the author is not a Bot. Both checks are needed — dependabot reports
  `author_association: CONTRIBUTOR`, so association alone would credit it — and
  together they cover a second account, an org member and any future
  collaborator without anyone remembering to add a login.

inputs:
  token:
    description: >
      Token with contents:write on the release-please branch (to commit the
      amended CHANGELOG.md) AND pull-requests:write on the repo (to push the
      amended description back with `gh pr edit`). The release-please template
      passes its PAT, which carries both; a GITHUB_TOKEN scoped to contents
      alone will commit the changelog and then fail to update the PR body.
    required: true
  pr:
    description: >
      The release PR number from release-please's `pr` output. Empty means no
      release PR exists this run, and the action is a no-op.
    required: false
    default: ''
  exclude-logins:
    description: >
      Extra comma-separated logins never to credit, beyond what
      `author_association` and the Bot check already exclude. An escape hatch,
      not the mechanism.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Amend changelog with contributor credits
      if: inputs.pr != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_JSON: ${{ inputs.pr }}
        EXCLUDE: ${{ inputs.exclude-logins }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        # release-please's `pr` output is a JSON object, not a number.
        branch=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // empty')
        number=$(printf '%s' "$PR_JSON" | jq -r '.number // empty')
        if [ -z "$branch" ] || [ -z "$number" ]; then
          echo "No release PR this run; nothing to credit."
          exit 0
        fi

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch --quiet origin "$branch"
        git checkout --quiet -B "$branch" "origin/$branch"

        if [ ! -f CHANGELOG.md ]; then
          echo "No CHANGELOG.md; nothing to credit."
          exit 0
        fi

        # The release PR's description carries the same entries as the
        # changelog's top block, but release-please regenerates it from its own
        # notes — it never re-reads the branch, so a credit committed to the
        # file does not reach it. Amend a copy alongside, and push it back.
        # Tolerated, not fatal: a body this cannot read must not cost the
        # changelog its credits. An unreadable body stays byte-identical to
        # `body_before`, so the push below is skipped rather than blanking the
        # description with an empty file.
        body_file="$(mktemp)"
        if ! gh pr view "$number" --repo "$REPO" --json body --jq '.body' > "$body_file" 2>/dev/null; then
          echo "::warning::could not read PR #$number's body — crediting the changelog only"
          : > "$body_file"
        fi
        body_before="$(cat "$body_file")"

        # True when $2 references PR $1 without already crediting it.
        needs_credit() {
          grep -E "/(issues|pull)/$1\b" "$2" 2>/dev/null | grep -qv "thanks @"
        }

        never="$EXCLUDE"

        # Collect the PR numbers referenced by the changelog's UNRELEASED top
        # block only — older entries are already published and must not churn.
        prs=$(awk '
          /^## / { seen++ }
          seen == 1 { print }
        ' CHANGELOG.md | grep -oE '/(issues|pull)/[0-9]+' | grep -oE '[0-9]+' | sort -u || true)

        changed=0
        for n in $prs; do
          # FIRST, before the API call: an already-credited PR must cost
          # nothing. This sat AFTER the `gh api` below, so the comment claiming
          # it saved a call was simply false — the call had already run.
          # Matches "thanks @" ANYWHERE on the line referencing this PR: the
          # credit is inserted BEFORE the `([#n](` link group, so a check
          # anchored after the link never matches at all.
          #
          # Both targets have to be checked: the changelog is committed on the
          # branch and survives, while the body is rewritten from scratch by
          # every release-please run. Skipping on the changelog alone left an
          # already-credited entry's BODY uncredited forever.
          if ! needs_credit "$n" CHANGELOG.md && ! needs_credit "$n" "$body_file"; then
            continue
          fi

          # `gh api` prints its ERROR BODY TO STDOUT on a failure, so a 404
          # yields non-empty output and `[ -z "$meta" ]` never fires. Gate on
          # the EXIT STATUS instead.
          #
          # This is not hypothetical: a changelog entry carrying `closes #136`
          # puts an ISSUE number in the line, `repos/.../pulls/136` 404s, and
          # the raw JSON was written into the changelog as the contributor
          # name — `(thanks @{"message":"Not Found",...})` (skylight-mcp#135).
          if ! meta=$(gh api "repos/$REPO/pulls/$n" \
                --jq '[.user.login, .user.type, .author_association] | @tsv' 2>/dev/null); then
            echo "  #$n: not a pull request (or unreadable) — skipping"
            continue
          fi
          [ -z "$meta" ] && continue
          author=$(printf '%s' "$meta" | cut -f1)
          utype=$(printf '%s' "$meta" | cut -f2)
          assoc=$(printf '%s' "$meta" | cut -f3)
          [ -z "$author" ] && continue

          # Belt and braces: whatever happens upstream, only a plausible GitHub
          # login is ever written into a changelog. A login is alphanumerics and
          # hyphens, 39 chars max — a JSON blob, a sentence, or anything with a
          # quote or brace cannot pass, so a future failure mode that produces
          # garbage still cannot corrupt the file.
          case "$author" in
            *[!A-Za-z0-9-]*|"" )
              echo "::warning::refusing to credit #$n — '$author' is not a valid GitHub login"
              continue ;;
          esac
          [ "${#author}" -gt 39 ] && { echo "::warning::refusing to credit #$n — login too long"; continue; }

          # A bot is never a contributor to thank. Checked separately from the
          # association because dependabot reports CONTRIBUTOR.
          [ "$utype" = "Bot" ] && continue

          # Anyone with write-side standing in the repo is "us", not an
          # external contributor. GitHub decides this, so a second account, an
          # org member or a new collaborator is covered with no list to update.
          case "$assoc" in OWNER|MEMBER|COLLABORATOR) continue ;; esac

          case ",$never," in *",$author,"*) continue ;; esac

          # The script is the single authority on whether anything changed —
          # it prints "changed" only when it edited a line. Logging off the
          # script rather than off reaching this point is what stops the run
          # claiming a credit it did not make.
          amended=""
          if [ "$(python3 "$GITHUB_ACTION_PATH/amend_changelog.py" CHANGELOG.md "$n" "$author")" = "changed" ]; then
            changed=1; amended="CHANGELOG.md"
          fi
          # `--all-blocks`: every `## ` section of a release PR body belongs to
          # the release being proposed, unlike the changelog's published tail.
          if [ "$(python3 "$GITHUB_ACTION_PATH/amend_changelog.py" "$body_file" "$n" "$author" --all-blocks)" = "changed" ]; then
            amended="${amended:+$amended + }PR body"
          fi
          [ -n "$amended" ] && echo "credited @$author for #$n ($amended)"
        done

        if [ "$changed" = "1" ] && ! git diff --quiet CHANGELOG.md; then
          git add CHANGELOG.md
          git commit -q -m "chore: credit external contributors in the changelog"
          git push --quiet origin "HEAD:$branch"
          echo "Amended $branch."
        else
          echo "No changelog credits to add."
        fi

        # Pushed separately from the commit: the body can need a credit the
        # committed changelog already carries (release-please rewrote the body
        # over it), and that case must still reach the description.
        if [ "$(cat "$body_file")" != "$body_before" ]; then
          gh pr edit "$number" --repo "$REPO" --body-file "$body_file"
          echo "Amended the release PR description (#$number)."
        else
          echo "No PR-body credits to add."
        fi
