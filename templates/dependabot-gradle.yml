# Thin config — the fleet-wide shape lives in chrischall/workflows.
# Renders to: .github/dependabot.yml
# Regenerate with: scripts/rollout.sh <owner/repo> --execute --only dependabot
#
# Majors are deliberately absent from the gradle group: a Gradle/AGP/Kotlin
# major is never a drive-by merge, and dependabot cannot run gradle, so a
# grouped major lands with a stale kotlin-js-store/yarn.lock.
#
# A repo that needs a permanent major hold (a pin that exists BECAUSE of the
# old major) keeps it in a fragment — templates/fragments/dependabot-ignore-
# <name>.yml, named by `dependabot_ignore` in fleet.json — NOT by opting out
# with `dependabot: none`. Opting out to protect one block costs the repo every
# other fix the template carries; curtaincall sat outside the template for its
# javax-namespace JAXB hold and missed the vitest pin because of it.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Dependabot INFERS a commit prefix from recent history when this is unset,
    # which is why the fleet drifted into `chore(deps)`, `build(deps-dev)` and
    # `fix(deps)` with no config anywhere. Setting it makes the release
    # behaviour deterministic instead of a property of a repo's git log.
    #
    # `fix` for runtime dependencies, so a bump that changes what SHIPS cuts a
    # patch release and reaches consumers. `chore` for dev dependencies, which
    # ship nothing and stay out of the changelog. release-please reads the
    # squash subject, and the squash subject is this.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    # __DEPENDABOT_IGNORE__
    groups:
      gradle-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # `ci`, not `fix`: an action version ships nothing to a consumer, so it
    # belongs in the hidden CI section rather than cutting a patch release.
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        update-types:
          - minor
          - patch
