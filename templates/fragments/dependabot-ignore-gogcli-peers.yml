    ignore:
      # `agents` is a PEER of @chrischall/mcp-connector, and the connector — not
      # this repo — decides which versions are supported. Its published peer range
      # is `>=0.17.3 <0.23.0`, so a bump to 0.23.x cannot install here at all:
      # npm dies with ERESOLVE before a single test runs.
      #
      # This is not hypothetical. agents 0.19.0 met the connector's then-peer of
      # `^0.17.3` and took out every consumer's dependabot PR simultaneously
      # (chrischall/mcp-connector#11 widened the peer to fix it). The ceiling
      # below mirrors that peer so dependabot stops proposing bumps the harness
      # cannot accept — versions inside the window still flow normally.
      #
      # When the connector widens its peer, raise this ceiling in the same pass:
      # every consumer is listed in that repo's CLAUDE.md blast-radius section.
      # Last raised 2026-09-08 alongside mcp-connector#56, which widened the
      # peer from <0.20.0 to <0.23.0 to admit agents 0.22.
      - dependency-name: agents
        versions:
          - ">=0.23.0"
      # `@cloudflare/vitest-pool-workers` pins `peer vitest@"^4.1.0"`, so vitest
      # 5 cannot install here at all — `npm ci` dies with ERESOLVE before a test
      # runs. This is the ONLY repo in the fleet using pool-workers, which is
      # why the fleet-wide vitest-5 rollout does not apply to it.
      #
      # This is a ceiling, not a permanent hold: lift it when Cloudflare ships
      # a pool-workers whose peer accepts vitest 5. Until then dependabot would
      # re-propose the major every week and it would fail every week (#337).
      # 4.x minors and patches still flow normally.
      - dependency-name: vitest
        versions:
          - ">=5.0.0"
      - dependency-name: "@vitest/coverage-v8"
        versions:
          - ">=5.0.0"
