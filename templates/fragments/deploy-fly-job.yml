
  # Deploy the Fly backend at the released tag, so what is live tracks the
  # release instead of drifting behind main. Deliberately not `needs: publish`:
  # the backend is independent of npm and the MCP registry, so a registry
  # hiccup should not leave it stale. Any job that must run against the new
  # backend should `needs: deploy-runner`, so a failed deploy skips it too.
  deploy-runner:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: chrischall/workflows/.github/workflows/reusable-fly-deploy.yml@main
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      working-directory: __FLY_DIR__
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
