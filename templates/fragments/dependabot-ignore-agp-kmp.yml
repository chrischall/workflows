    ignore:
      # One root cause, four dependabot PRs, all permanently red:
      #
      #   AGP 9 is incompatible with org.jetbrains.kotlin.multiplatform.
      #
      #   "The 'com.android.library' (or 'com.android.application') plugin is
      #    not compatible with the 'org.jetbrains.kotlin.multiplatform' plugin
      #    since AGP 9.0."
      #
      # This is a KMP project, so AGP 9 is unavailable — and two other bumps
      # turn out to depend on it:
      #
      #   Gradle >= 9.6  AGP 8.x uses org.gradle.api.problems.internal.
      #                  InternalProblems, removed in 9.6.0. Gradle itself
      #                  says "update the plugin ... or use Gradle 9.5".
      #   Compose 1.12   androidx.compose.ui:ui-android:1.12.0 and its
      #                  siblings "require Android Gradle plugin 9.1.0 or
      #                  higher". That is compose-bom 2026.x.
      #
      # So the ceiling on all three is the same event: AGP shipping KMP
      # support. Each was proven separately on encore#161 — four CI runs,
      # each one peeling back a constraint the previous run revealed.
      #
      # Lift ALL THREE together at that point. Raising any one alone just
      # moves the failure: Gradle 9.7 fails on AGP 8, and compose-bom 2026
      # fails on AGP 8 too.
      #
      # Minors and patches inside the current majors keep flowing.
      - dependency-name: com.android.application
        update-types:
          - version-update:semver-major
      - dependency-name: com.android.library
        update-types:
          - version-update:semver-major
      # `gradle-wrapper`, NOT `gradle`. Dependabot names the wrapper by that
      # exact string — its branch is dependabot/gradle/gradle-wrapper-9.7.1 —
      # and a `gradle` rule matches nothing, which is silent: the config is
      # valid and the ignore simply never fires. Proven the hard way: the first
      # version of this fragment used `gradle`, and while the AGP and
      # compose-bom rules closed encore#160 and #159 immediately, #158 stayed
      # open.
      - dependency-name: gradle-wrapper
        versions:
          - ">=9.6"
      - dependency-name: androidx.compose:compose-bom
        versions:
          - ">=2026.0"
      # androidx.core 1.19.0 carries the same AGP 9.1 floor as Compose 1.12:
      #
      #   Dependency 'androidx.core:core-ktx:1.19.0' requires Android Gradle
      #   plugin 9.1.0 or higher.
      #
      # Found on encore#163, a 17-update group where this was the ONLY blocked
      # member — agp 8.13.2, kotlin 2.4.10, coroutines, serialization, ktor and
      # skie were all fine. Hence a ceiling on this artifact rather than a hold
      # on the group: blocking all of it to stop one library would strand six
      # good bumps.
      #
      # EXPECT THIS TO RECUR. androidx is adopting the AGP 9.1 floor library by
      # library, so more entries belong here over time — each one identified the
      # same way, by a `requires Android Gradle plugin 9.1.0 or higher` line
      # naming the artifact. They all lift together with the rest of this
      # fragment when AGP 9 supports KMP.
      - dependency-name: androidx.core:*
        versions:
          - ">=1.19.0"
