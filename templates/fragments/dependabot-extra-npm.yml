  # The npm projects below the repo root (fleet.json `dependabot_extra`), ALL
  # in this one entry: dependabot groups never span update entries, so one
  # entry per directory sent the same vitest/typescript major twice. Same
  # prefixes and groups as a root npm project: `fix` so a runtime bump cuts a
  # release, `chore` for dev bumps, and vitest's coverage provider named
  # exactly so dependabot never splits that peer-locked pair into two PRs.
  - package-ecosystem: npm
    directories:
      # __DEPENDABOT_DIRECTORIES__
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      # Majors get groups of their own rather than no group at all. Excluded
      # from the two groups above (a major is not a drive-by merge), every
      # major used to be a PR of its own — curtaincall's first run opened 11.
      # Split by dependency type so the commit prefix stays right: a
      # production major is `fix` and cuts a release, a dev major is `chore`.
      #
      # These declare no patterns, so they score 500 — BELOW the vitest
      # group's exact names (1000). A vitest major still lands in `vitest`
      # beside its coverage provider, never here (rollout.test.sh case GG).
      production-majors:
        dependency-type: production
        update-types:
          - major
      dev-majors:
        dependency-type: development
        update-types:
          - major
      # SECURITY fixes, as ONE PR per update entry. `applies-to` is what
      # scopes it: a group without that key defaults to version-updates, so
      # none of the groups above ever collects an advisory, and this one never
      # collects a routine bump. `*` rather than a dependency type so a
      # same-day advisory across runtime and dev dependencies still lands as a
      # single PR.
      security:
        applies-to: security-updates
        patterns:
          - "*"

