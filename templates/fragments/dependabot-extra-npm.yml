  # An npm project below the repo root (fleet.json `dependabot_extra`). Same
  # prefixes and groups as a root npm project: `fix` so a runtime bump cuts a
  # release, `chore` for dev bumps, and vitest's coverage provider named
  # exactly so dependabot never splits that peer-locked pair into two PRs.
  - package-ecosystem: npm
    directory: __DEPENDABOT_DIRECTORY__
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

