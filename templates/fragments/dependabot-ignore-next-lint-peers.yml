    ignore:
      # A Next.js app's `next lint` stack caps TypeScript one major below its
      # latest. `eslint-config-next` bundles typescript-eslint, whose peer is
      # `>=4.8.4 <6.1.0`, and lint aborts on 7 with "typescript-eslint does
      # not support TS 7.0" before a file is linted.
      #
      # Found by curtaincall#375, which bumped /web to TypeScript 7 and failed
      # lint.
      #
      # `typescript` is held by MAJOR, not by a version ceiling, because this
      # entry is shared by every directory it lists: curtaincall's
      # /ops/uptime-worker has no lint and already runs TypeScript 7, so a
      # `>=7.0.0` ceiling would also freeze its 7.x patches. Minors and patches
      # still flow everywhere.
      #
      # This fragment held ESLint 10 too, for eslint-plugin-react's `^9.7`
      # peer. curtaincall#402 took ESLint 10 anyway by pinning
      # `settings.react.version` around the crash, and the hold then kept
      # every 10.x patch out of /web until it was noticed. Hold only what the
      # lint stack still cannot load.
      #
      # A ceiling, not a permanent hold. Lift it when typescript-eslint's peer
      # admits TypeScript 7 — read that peer range, not the TypeScript
      # changelog. Tracked for removal in nullnet-app/curtaincall#382.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
