    ignore:
      # VITEST IS ONE VERSION ACROSS THIS REPO, AND THE PLUGIN PICKS IT.
      #
      # `@cloudflare/vitest-plugin` (in `packages/gateway`, the successor to the
      # deprecated `@cloudflare/vitest-pool-workers`) peers on
      # `vitest@"^4.1.0 || ^5.0.0"`. The gateway suite runs inside workerd
      # through it, so a vitest major it does not support is not a slow
      # migration — the suite does not start (vitest 5 under the old pool gave
      # 100+ `jsg.SyntaxError`s before a single assertion ran, mcp-host#716).
      #
      # And it cannot be taken one workspace at a time. Dependabot treats
      # vitest as ONE repo-wide version: a split was flattened by the next
      # ordinary patch bump, which is why that repo's CLAUDE.md says all five
      # move together or none do. All five moved to 5 together
      # (fleet-audit#1283). Lift this ceiling when the plugin's peer range
      # admits vitest 6: the thing to read is that peer range, not vitest's
      # changelog.
      #
      # A ceiling, not a freeze. 5.x minors and patches flow normally.
      - dependency-name: vitest
        versions:
          - ">=6.0.0"
