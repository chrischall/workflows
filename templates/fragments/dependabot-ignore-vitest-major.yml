    ignore:
      # VITEST IS ONE VERSION ACROSS THE REPO, AND THE POOL PICKS IT.
      #
      # `@cloudflare/vitest-pool-workers` peers on `^4.1.0`. The gateway suite
      # runs inside workerd through that pool, so a vitest major it does not
      # support is not a slow migration — the suite does not start. Bumping to
      # 5.0.0 gave 100+ `jsg.SyntaxError: Unexpected identifier 'file'` out of
      # workerd before a single gateway assertion ran (mcp-host#716).
      #
      # And it cannot be taken in one workspace at a time. Dependabot treats
      # vitest as ONE repo-wide version: a split that put four workspaces on 5
      # and left the gateway on 4 was flattened by the next ordinary patch bump,
      # which is why the repo's CLAUDE.md says all five move together or none do.
      #
      # So majors are ignored until the pool supports one. This is a CEILING,
      # not a freeze: 4.x patches and minors flow normally, which is where the
      # security fixes are. Lift it in the same pass that bumps the pool — the
      # pool's peer range is the thing to read, not vitest's changelog.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
