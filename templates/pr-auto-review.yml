name: PR auto-review

# Thin stub — the pipeline lives in chrischall/workflows.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  # Fork PRs cannot be reviewed on `pull_request`: GitHub withholds secrets from
  # fork runs, so the review has no credential, and `pull_request_target` — the
  # usual answer — is rejected by Anthropic's OIDC backend
  # (anthropics/claude-code-action#713). `issue_comment` fires in the BASE repo
  # with secrets intact, which is the same mechanism claude.yml already uses to
  # reach forks.
  #
  # It is human-gated by construction: a maintainer has to type the command, and
  # the reusable workflow checks `author_association`. That is the gate — a fork
  # review never starts on its own.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

# `labeled` events get their own group keyed by label name: opening a PR
# with --label fires `opened`+`labeled` back-to-back, and a shared group
# would let the labeled event displace the queued review, leaving the PR
# with no verdict and no label.
concurrency:
  # The PR number comes from `pull_request` OR `issue` — exactly one is set, and
  # `issue_comment` carries no `pull_request` object. Reading only the former
  # made every `/auto-review` comment across every PR share ONE group, so a
  # review on PR 5 cancelled a review still running on PR 9.
  #
  # Evaluated here rather than from the `context` job: `concurrency` is resolved
  # before any job runs, so it cannot read `needs`.
  group: |
    pr-auto-review-${{ github.event.pull_request.number || github.event.issue.number }}${{
      github.event.action == 'labeled'
        && format('-labeled-{0}', github.event.label.name)
        || ''
    }}
  cancel-in-progress: false

jobs:
  review:
    uses: chrischall/workflows/.github/workflows/reusable-pr-auto-review.yml@main
    with:
      conventions_hint: "__CONVENTIONS_HINT__"
      rereview_on_push: __REREVIEW_ON_PUSH__
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      release_pat: ${{ secrets.__PAT_SECRET__ }}
